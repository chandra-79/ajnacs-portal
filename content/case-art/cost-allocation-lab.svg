<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 1280 720" role="img" aria-label="A billing lab separates direct charges from shared charges, assigns the shared pool by an agreed usage driver, and reconciles service ledgers plus any residual to the full bill."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#655A91"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F3FA" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#282445" font-size="69" font-weight="700" stroke="#282445" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Make the whole cloud bill balance</text><path d="M80 154H1200" fill="none" stroke="#655A91" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="195" width="359" height="412" rx="23" fill="#FFFFFF" stroke="#E6E0F5" stroke-width="3.25"/><rect x="99" y="315" width="321" height="165" rx="17" fill="#E6E0F5" stroke="none" stroke-width="3.25"/><text x="259.5" y="259" text-anchor="middle" fill="#282445" font-size="39" font-weight="700" stroke="#282445" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Direct charges</text><g transform="translate(259.5 399) scale(2.234375)" fill="none" stroke="#282445" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-16" rx="24" ry="9"/><path d="M-24-16v28c0 13 48 13 48 0v-28m-48 10c0 13 48 13 48 0m-48 10c0 13 48 13 48 0"/></g><text x="259.5" y="526" text-anchor="middle" fill="#282445" font-size="25" font-weight="400">Assign to the known service</text><rect x="460" y="195" width="359" height="412" rx="23" fill="#FFFFFF" stroke="#E6E0F5" stroke-width="3.25"/><rect x="479" y="315" width="321" height="165" rx="17" fill="#E6E0F5" stroke="none" stroke-width="3.25"/><text x="639.5" y="259" text-anchor="middle" fill="#282445" font-size="39" font-weight="700" stroke="#282445" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Shared charges</text><g transform="translate(639.5 399) scale(2.234375)" fill="none" stroke="#282445" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-19 0H0m0 0v-20h19M0 0v20h19"/><circle cx="-24" r="6"/><circle cx="24" cy="-20" r="6"/><circle cx="24" cy="20" r="6"/></g><text x="639.5" y="526" text-anchor="middle" fill="#282445" font-size="29" font-weight="400">Split by an agreed driver</text><rect x="840" y="195" width="359" height="412" rx="23" fill="#3A3457" stroke="none" stroke-width="3.25"/><rect x="859" y="315" width="321" height="165" rx="17" fill="#655A91" stroke="none" stroke-width="3.25"/><circle cx="1167" cy="226" r="12" fill="#BEEDE0" stroke="none" stroke-width="3.5"/><text x="1019.5" y="259" text-anchor="middle" fill="#FFFFFF" font-size="37" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Reconcile the total</text><g transform="translate(1019.5 399) scale(2.234375)" fill="none" stroke="#FFFFFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M-13 0l9 10 17-19"/></g><text x="1019.5" y="526" text-anchor="middle" fill="#FFFFFF" font-size="29" font-weight="400">Keep any residual visible</text></g></svg>
