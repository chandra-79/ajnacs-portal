<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 1280 720" role="img" aria-label="The pilot tracks accepted requests through a versioned template and distinguishes time to healthy deployment from completion, which includes unfinished attempts in the denominator."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#2C7762"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#EFF6F4" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#17392E" font-size="69" font-weight="700" stroke="#17392E" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Count unfinished deployments too</text><path d="M80 154H1200" fill="none" stroke="#2C7762" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#FDCF99" stroke="none" stroke-width="3.25"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#593819" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="255" y="454" text-anchor="middle" fill="#593819" font-size="36" font-weight="700" stroke="#593819" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Accepted request</text><path d="M429 400H516V329H672" fill="none" stroke="#2C7762" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="255" width="521" height="148" rx="19" fill="#FFFFFF" stroke="#CDE9E0" stroke-width="3.25"/><g transform="translate(738 329) scale(1.015625)" fill="none" stroke="#17392E" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M-13 0l9 10 17-19"/></g><text x="788" y="325" text-anchor="start" fill="#17392E" font-size="41" font-weight="