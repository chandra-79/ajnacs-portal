<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 1280 720" role="img" aria-label="A restore runs from snapshots and replay logs to an isolated environment. The team locates the latest recoverable write and stops the service recovery clock after a representative transaction passes."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#1F6894"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#EAF2F8" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#122B43" font-size="68" font-weight="700" stroke="#122B43" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">A restore ends at a real transaction</text><path d="M80 154H1200" fill="none" stroke="#1F6894" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M336 351H941" fill="none" stroke="#1F6894" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="190" y="275" width="154" height="152" rx="32" fill="#D4ECFA" stroke="none" stroke-width="3.25"/><g transform="translate(267 351) scale(1.515625)" fill="none" stroke="#122B43" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M0-28l30 15L0 2l-30-15Z M-30 0 0 15 30 0 M-30 13 0 28 30 13"/></g><text x="267" y="486" text-anchor="middle" fill="#122B43" font-size="37" font-weight="700" stroke="#122B43" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Snapshot and logs</text><text x="267" y="533" text-anchor="middle" fill="#122B43" font-size="28" font-weight="400">Locate the latest safe write</text><rect x="563" y="275" width="154" height="152" rx="32" fill="#D4ECFA" stroke="none" stroke-width="3.25"/><g transform="translate(640 351) scale(1.515625)" fill="none" stroke="#122B43" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 24-20v17c0 14-10 24-24 33C-14 21-24 11-24-3V-20Z M-10 0l7 7 14-15"/></g><text x="640" y="486" text-anchor="middle" fill="#122B43" font-size="37" font-weight="700" stroke="#122B43" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Isolated restore</text><text x="640" y="533" text-anchor="middle" fill="#122B43" font-size="26" font-weight="400">Load data and dependencies</text><path d="M542 343l15 8-15 8Z" fill="#1F6894"/><rect x="936" y="275" width="154" height="152" rx="32" fill="#FFD48F" stroke="none" stroke-width="3.25"/><g transform="translate(1013 351) scale(1.515625)" fill="none" stroke="#5C3511" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M-13 0l9 10 17-19"/></g><text x="1013" y="486" text-anchor="middle" fill="#122B43" font-size="37" font-weight="700" stroke="#122B43" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Verified transaction</text><text x="1013" y="533" text-anchor="middle" fill="#122B43" font-size="31" font-weight="400">Stop the recovery clock</text><path d="M80 584H1200" fill="none" stroke="#1F6894" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
