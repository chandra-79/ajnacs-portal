<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 1280 720" role="img" aria-label="A calibrated score cutoff sends confident classifications to automatic routing and ambiguous cases to a review queue sized for its workload."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#3E6D37"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F7EF" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#20361B" font-size="69" font-weight="700" stroke="#20361B" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Size the review queue</text><path d="M80 154H1200" fill="none" stroke="#3E6D37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#27482A" stroke="none" stroke-width="3.25"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#FFFFFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="27"/><circle r="17"/><circle r="7"/></g><text x="255" y="454" text-anchor="middle" fill="#FFFFFF" font-size="39" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Calibrated cutoff</text><text x="255" y="501" text-anchor="middle" fill="#FFFFFF" font-size="31" font-weight="400">Use held-out data</text><path d="M429 400H516V329H672" fill="none" stroke="#3E6D37" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="255" width="521" height="148" rx="19" fill="#FFFFFF" stroke="#E0ECD7" stroke-width="3.25"/><g transform="translate(738 329) scale(1.015625)" fill="none" stroke="#20361B" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M6-31-24 6h21l-5 25L25-9H3Z"/></g><text x="788" y="325" text-anchor="start" fill="#20361B" font-size="45" font-weight="700" stroke="#20361B" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Automatic routing</text><text x="788" y="357" text-anchor="start" fill="#20361B" font-size="32" font-weight="400">Check harmful errors</text><path d="M429 400H538V491H672" fill="none" stroke="#3E6D37" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="417" width="521" height="148" rx="19" fill="#FDE09E" stroke="none" stroke-width="3.25"/><g transform="translate(738 491) scale(1.015625)" fill="none" stroke="#553813" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle cx="-12" cy="-13" r="9"/><circle cx="13" cy="-10" r="8"/><path d="M-31 22a19 19 0 0138 0Zm43 0h17a16 16 0 00-19-15"/></g><text x="788" y="487" text-anchor="start" fill="#553813" font-size="45" font-weight="700" stroke="#553813" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Human review</text><text x="788" y="519" text-anchor="start" fill="#553813" font-size="32" font-weight="400">Budget staff capacity</text><circle cx="429" cy="400" r="8" fill="#27482A" stroke="#3E6D37" stroke-width="3.5"/></g></svg>
