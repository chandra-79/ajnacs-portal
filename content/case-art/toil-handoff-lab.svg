<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 1280 720" role="img" aria-label="During a runbook handoff, operators verify clear work, inspect partly completed work, and preserve evidence and escalate when the observed state conflicts."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#4B6E42"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F2F7EE" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#273925" font-size="69" font-weight="700" stroke="#273925" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Rehearse when to stop</text><path d="M80 154H1200" fill="none" stroke="#4B6E42" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#2D4C35" stroke="none" stroke-width="3.25"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#FFFFFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17c-7-8-18-10-30-7v45C-18 18-7 20 0 28c7-8 18-10 30-7v-45C18-27 7-25 0-17Zm0 0v45m-22-43c5 0 10 1 14 4m16 0c4-3 9-4 14-4"/></g><text x="255" y="454" text-anchor="middle" fill="#FFFFFF" font-size="38" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Read back scope</text><text x="255" y="501" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="400">Check the last safe state</text><path d="M429 400H505V266H672" fill="none" stroke="#4B6E42" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="200" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#E1ECD9" stroke-width="3.25"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#273925" stroke-width="3.45" stroke-linecap="round" stroke-linejo