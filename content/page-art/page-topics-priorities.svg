<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Distinguishing urgency from importance begins by making deadlines and consequences explicit, then protecting valuable work that can be scheduled."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#3E6D37"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F7EF" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#20361B" font-size="69" font-weight="700" stroke="#20361B" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Ask what changes if work waits</text><path d="M80 154H1200" fill="none" stroke="#3E6D37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#27482A" stroke="none" stroke-width="3.25"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#FFFFFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-28-19H12l16 14V19h-56Z M12-19V-5h16M-16-5H2m-18 10h26"/></g><text x="255" y="454" text-anchor="middle" fill="#FFFFFF" font-size="37" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Incoming request</text><text x="255" y="501" text-anchor="middle" fill="#FFFFFF" font-size="31" font-weight="400">Ask who is affected</text><path d="M429 400H516V329H672" fill="none" stroke="#3E6D37" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="255" width="521" height="148" rx="19" fill="#FDE09E" stroke="none" stroke-width="3.25"/><g transform="translate(738 329) scale(1.015625)" fill="none" stroke="#553813" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M0-16V0l12 8M0-26v3m26 23h-3M0 26v-3m-26