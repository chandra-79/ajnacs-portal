<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="A reader stays with one paragraph, explains its point in their own words, and notes where to resume later."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#E0ECD7"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#20361B" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="69" font-weight="700" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Read until you can explain it</text><path d="M80 154H1200" fill="none" stroke="#E0ECD7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M336 351H941" fill="none" stroke="#E0ECD7" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="190" y="275" width="154" height="152" rx="32" fill="#27482A" stroke="none" stroke-width="3.25"/><g transform="translate(267 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17c-7-8-18-10-30-7v45C-18 18-7 20 0 28c7-8 18-10 30-7v-45C18-27 7-25 0-17Zm0 0v45m-22-43c5 0 10 1 14 4m16 0c4-3 9-4 14-4"/></g><text x="267" y="486" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Stay with a passage</text><text x="267" y="533" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="400">Read one section closely</text><rect x="563" y="275" width="154" height="152" rx="32" fill="#FDE09E" stroke="none" stroke-width="3.25"/><g transform="translate(640 351) scale(1.515625)" fill="none" stroke="#553813" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-13 16a9 9 0 00-3-7C-30-6-18-29 0-29S30-6 16 9a9 9 0 00-3 7v5h-26Z M-8 28H8M-13 16h26M0 15V1l-7-7M0 1l7-7"/></g><text x="640" y="486" text-anchor="middle" fill="#FFFFFF" font-size="37" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Explain it back</text><text x="640" y="533" text-anchor="middle" fill="#FFFFFF" font-size="31" font-weight="400">Say what it means</text><path d="M542 343l15 8-15 8Z" fill="#E0ECD7"/><rect x="936" y="275" width="154" height="152" rx="32" fill="#27482A" stroke="none" stroke-width="3.25"/><g transform="translate(1013 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 27v-53m0 2c20-15 24 15 42 0v29C6 20 2-10-18 5"/></g><text x="1013" y="486" text-anchor="middle" fill="#FFFFFF" font-size="37" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Leave a way back</text><text x="1013" y="533" text-anchor="middle" fill="#FFFFFF" font-size="31" font-weight="400">Mark where to resume</text><path d="M80 584H1200" fill="none" stroke="#E0ECD7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
