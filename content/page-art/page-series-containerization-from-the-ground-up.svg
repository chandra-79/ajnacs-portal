<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="The series explains containers as processes whose views are isolated by namespaces and whose resource use is governed by cgroups."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#846448"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F7F3EE" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#392E23" font-size="69" font-weight="700" stroke="#392E23" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Look inside a running container</text><path d="M80 154H1200" fill="none" stroke="#846448" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M135 248h953l32 19-32 19H135l-32-19Z" fill="#ECDFCF"/><rect x="93" y="260" width="1037" height="87" rx="19" fill="#FFFFFF" stroke="#ECDFCF" stroke-width="3.25"/><g transform="translate(155 303.5) scale(1.015625)" fill="none" stroke="#392E23" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><rect x="-28" y="-26" width="56" height="22" rx="5"/><rect x="-28" y="4" width="56" height="22" rx="5"/><path d="M-18-15h3m7 0h3m-13 30h3m7 0h3m12-30h11m-11 30h11"/></g><text x="205" y="299.5" text-anchor="start" fill="#392E23" font-size="45" font-weight="700" stroke="#392E23" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Process</text><text x="205" y="331.5" text-anchor="start" fill="#392E23" font-size="32" font-weight="400">Run on a shared kernel</text><path d="M168 361h887l32 19-32 19H168l-32-19Z" fill="#ECDFCF"/><rect x="126" y="373" width="971" height="87" rx="19" fill="#FFFFFF" stroke="#ECDFCF" stroke-width="3.25"/><g transform="translate(188 416.5) scale(1.015625)" fill="none" stroke="#392E23" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"