<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="A proportionate decision uses what is known, marks uncertainty, and records what evidence would reopen the choice."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#137787"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ECF8FA" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#123C4A" font-size="69" font-weight="700" stroke="#123C4A" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Act with an incomplete map</text><path d="M80 154H1200" fill="none" stroke="#137787" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="192" width="498" height="438" rx="32" fill="#104D5C" stroke="none" stroke-width="3.25"/><circle cx="329" cy="364" r="136" fill="#137787" stroke="none" stroke-width="3.5"/><circle cx="329" cy="364" r="112" fill="#104D5C" stroke="#CBEFF1" stroke-width="3.5"/><g transform="translate(329 364) scale(2.671875)" fill="none" stroke="#FED698" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="28"/><path d="M19-19 8 8l-27 11L-8-8ZM-28 0h5m46 0h5M0-28v5m0 46v5"/></g><text x="329" y="550" text-anchor="middle" fill="#FFFFFF" font-size="47" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Proportionate action</text><text x="329" y="594" text-anchor="middle" fill="#FFFFFF" font-size="31" font-weight="400">Match risk to the action</text><rect x="624" y="210" width="573" height="126" rx="19" fill="#FFFFFF" stroke="#CBEFF1" stroke-width="3.25"/><g transform="translate(686 273) scale(0.8125)" fill="none" stroke="#123C4A" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="736" y="269" text-anchor="start" fill="#123C4A" font-size="35" font-weight="700" stroke="#123C4A" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Known evidence</text><text x="736" y="301" text-anchor="start" fill="#123C4A" font-size="27" font-weight="400">Mark the reliable parts</text><rect x="624" y="348" width="573" height="126" rx="19" fill="#FFFFFF" stroke="#CBEFF1" stroke-width="3.25"/><g transform="translate(686 411) scale(0.8125)" fill="none" stroke="#123C4A" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><ellipse rx="12" ry="26"/><path d="M-26 0h52m-44-16h36m-36 32h36"/></g><text x="736" y="407" text-anchor="start" fill="#123C4A" font-size="35" font-weight="700" stroke="#123C4A" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Uncertain assumptions</text><text x="736" y="439" text-anchor="start" fill="#123C4A" font-size="27" font-weight="400">Name what could change</text><rect x="624" y="486" width="573" height="126" rx="19" fill="#FFFFFF" stroke="#CBEFF1" stroke-width="3.25"/><g transform="translate(686 549) scale(0.8125)" fill="none" stroke="#123C4A" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 27v-53m0 2c20-15 24 15 42 0v29C6 20 2-10-18 5"/></g><text x="736" y="545" text-anchor="start" fill="#123C4A" font-size="35" font-weight="700" stroke="#123C4A" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Decision record</text><text x="736" y="577" text-anchor="start" fill="#123C4A" font-size="27" font-weight="400">Set a revisit trigger</text></g></svg>
