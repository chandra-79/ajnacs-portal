<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Useful writing preserves the question, evidence and next action so others can review the decision and return to the work later."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#F5E0D9"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#3E221C" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="67" font-weight="700" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Leave the context next to the result</text><path d="M80 154H1200" fill="none" stroke="#F5E0D9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M336 351H941" fill="none" stroke="#F5E0D9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="190" y="275" width="154" height="152" rx="32" fill="#753D30" stroke="none" stroke-width="3.25"/><g transform="translate(267 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="267" y="486" text-anchor="middle" fill="#FFFFFF" font-size="37" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Question</text><text x="267" y="533" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="400">Name the problem and scope</text><rect x="563" y="275" width="154" height="152" rx="32" fill="#753D30" stroke="none" stroke-width="3.25"/><g transform="translate(640 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-5" r="18"/><path d="M8 8l18 18M-13-5h16m-8-8V3"/></g><text x