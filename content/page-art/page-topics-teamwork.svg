<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="A smooth release can depend on explicit scope, a dependency check and good handover. A team review makes those choices repeatable."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#F4D9C6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#362018" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="60" font-weight="700" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Review why an ordinary release worked</text><path d="M80 154H1200" fill="none" stroke="#F4D9C6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M336 351H941" fill="none" stroke="#F4D9C6" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="190" y="275" width="154" height="152" rx="32" fill="#703420" stroke="none" stroke-width="3.25"/><g transform="translate(267 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="267" y="486" text-anchor="middle" fill="#FFFFFF" font-size="37" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Clear scope</text><text x="267" y="533" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="400">Name the plan and owners</text><rect x="563" y="275" width="154" height="152" rx="32" fill="#DCE8A6" stroke="none" stroke-width="3.25"/><g transform="translate(640 351) scale(1.515625)" fill="none" stroke="#3D4A17" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M-13 0l9 10 17-19"/></g><text x="640" y="486" te