<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="End-to-end latency can come from queue residence, service time, or waiting on a dependency. Compare them before changing capacity."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#6746A5"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F4FB" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#261944" font-size="69" font-weight="700" stroke="#261944" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Find the work behind latency</text><path d="M80 154H1200" fill="none" stroke="#6746A5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#33255B" stroke="none" stroke-width="3.25"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#FFFFFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M0-16V0l12 8M0-26v3m26 23h-3M0 26v-3m-26-23h3"/></g><text x="255" y="454" text-anchor="middle" fill="#FFFFFF" font-size="42" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Latency budget</text><text x="255" y="501" text-anchor="middle" fill="#FFFFFF" font-size="31" font-weight="400">Start at the caller</text><path d="M429 400H505V266H672" fill="none" stroke="#6746A5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="200" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#E9DFF7" stroke-width="3.25"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#261944" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><rect x="-30" y="-15" width="60" height="30" rx="5"/><path d="M-10-15v30m20