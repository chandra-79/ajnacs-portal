<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="Everyday professional practice couples a better question with a small test and a note that makes the revised judgment findable."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#A44361"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FBF0F1" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#49202C" font-size="69" font-weight="700" stroke="#49202C" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Make a choice you can explain</text><path d="M80 154H1200" fill="none" stroke="#A44361" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M337 386H940" fill="none" stroke="#A44361" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><path d="M1013 444V589Q1013 616 986 616H294Q267 616 267 589V457" fill="none" stroke="#A44361" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)" stroke-dasharray="8 8"/><circle cx="267" cy="386" r="66" fill="#F1D8E1" stroke="#A44361" stroke-width="3.5"/><g transform="translate(267 386) scale(1.359375)" fill="none" stroke="#49202C" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-5" r="18"/><path d="M8 8l18 18M-13-5h16m-8-8V3"/></g><text x="267" y="267" text-anchor="middle" fill="#49202C" font-size="37" font-weight="700" stroke="#49202C" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Useful question</text><text x="267" y="304" text-anchor="middle" fill="#49202C" font-size="27" font-weight="400">State what would clarify it</text><circle cx="640" cy="386" r="66" fill="#F1D8E1" stroke="#A44361" stroke-width="3.5"/><g transform="translate(640 386) scale(1.359375)" fill="none" stroke="#49202C" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="27"/><circle r="17"/><circle r="7"/></g><text x="640" y="267" text-anchor="middle" fill="#49202C" font-size="34" font-weight="700" stroke="#49202C" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Bounded experiment</text><text x="640" y="304" text-anchor="middle" fill="#49202C" font-size="29" font-weight="400">Try one change at a time</text><circle cx="1013" cy="386" r="66" fill="#BFE8DF" stroke="#A44361" stroke-width="3.5"/><g transform="translate(1013 386) scale(1.359375)" fill="none" stroke="#214D46" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="1013" y="267" text-anchor="middle" fill="#49202C" font-size="37" font-weight="700" stroke="#49202C" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Decision record</text><text x="1013" y="304" text-anchor="middle" fill="#49202C" font-size="25" font-weight="400">Preserve evidence and next</text></g></svg>
