<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="The advisory portal compares event time with a freshness threshold and displays timely, delayed, and missing observations differently. Freshness depends on source event time even while the dashboard is healthy."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#137787"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#ECF8FA" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#123C4A" font-size="69" font-weight="700" stroke="#123C4A" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Show the age of a reading</text><path d="M80 154H1200" fill="none" stroke="#137787" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="195" width="359" height="412" rx="23" fill="#FFFFFF" stroke="#CBEFF1" stroke-width="3.25"/><rect x="99" y="315" width="321" height="165" rx="17" fill="#CBEFF1" stroke="none" stroke-width="3.25"/><text x="259.5" y="259" text-anchor="middle" fill="#123C4A" font-size="39" font-weight="700" stroke="#123C4A" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Timely reading</text><g transform="translate(259.5 399) scale(2.234375)" fill="none" stroke="#123C4A" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M-13 0l9 10 17-19"/></g><text x="259.5" y="526" text-anchor="middle" fill="#123C4A" font-size="27" font-weight="400">Within the event-time limit</text><rect x="460" y="195" width="359" height="412" rx="23" fill="#104D5C" stroke="none" stroke-width="3.25"/><rect x="479" y="315" width="321" height="165" rx="17" fill="#137787" stroke="none" stroke-width="3.25"/><circle cx="787" cy="226" r="12" fill="#FED698" stroke="none" stroke-width="3.5"/><text x="639.5" y="259" text-anchor="middle" fill="#FFFFFF" font-size="39" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Delayed reading</text><g transform="translate(639.5 399) scale(2.234375)" fill="none" stroke="#FFFFFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M0-16V0l12 8M0-26v3m26 23h-3M0 26v-3m-26-23h3"/></g><text x="639.5" y="526" text-anchor="middle" fill="#FFFFFF" font-size="29" font-weight="400">Mark the display as stale</text><rect x="840" y="195" width="359" height="412" rx="23" fill="#FFFFFF" stroke="#CBEFF1" stroke-width="3.25"/><rect x="859" y="315" width="321" height="165" rx="17" fill="#CBEFF1" stroke="none" stroke-width="3.25"/><text x="1019.5" y="259" text-anchor="middle" fill="#123C4A" font-size="39" font-weight="700" stroke="#123C4A" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Missing reading</text><g transform="translate(1019.5 399) scale(2.234375)" fill="none" stroke="#123C4A" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 31 25h-62Z M0-9v16m0 9v1"/></g><text x="1019.5" y="526" text-anchor="middle" fill="#123C4A" font-size="28" font-weight="400">Expose the expected gap</text></g></svg>
