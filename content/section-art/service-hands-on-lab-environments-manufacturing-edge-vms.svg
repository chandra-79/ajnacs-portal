<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="A disposable edge VM accepts records during a simulated disconnection, verifies durable state after restart, and reconciles stable record identities after replay."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#1F6894"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#EAF2F8" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#122B43" font-size="61" font-weight="700" stroke="#122B43" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Reconcile every record after reconnect</text><path d="M80 154H1200" fill="none" stroke="#1F6894" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M89 500H1191" fill="none" stroke="#1F6894" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><path d="M206 491v-136h28v136Z" fill="#1F6894"/><rect x="152" y="291" width="136" height="116" rx="22" fill="#D4ECFA" stroke="none" stroke-width="3.25"/><g transform="translate(220 348) scale(1.125)" fill="none" stroke="#122B43" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-4-15 5-24a12 12 0 0117 17l-9 9a12 12 0 01-17 0m8 13-9 9a12 12 0 01-17-17l9-9a12 12 0 0117 0M-10 10l20-20"/></g><circle cx="220" cy="500" r="11" fill="#EAF2F8" stroke="#1F6894" stroke-width="3.5"/><text x="220" y="556" text-anchor="middle" fill="#122B43" font-size="21" font-weight="700" stroke="#122B43" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Upstream disconnected</text><path d="M486 491v-152h28v152Z" fill="#1F6894"/><rect x="432" y="275" width="136" height="116" rx="22" fill="#FFD48F" stroke="none" stroke-width="3.25"/><g transform="translate(500 332) scale(1.125)" fill="none" stroke="#5C3511" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-20" rx="24" ry="9"/><path d="M-24-20v39c0 12 48 12 48 0v-39m-48 13c0 12 48 12 48 0m-48 13c0 12 48 12 48 0"/></g><circle cx="500" cy="500" r="11" fill="#FFD48F" stroke="#1F6894" stroke-width="3.5"/><text x="500" y="556" text-anchor="middle" fill="#122B43" font-size="27" font-weight="700" stroke="#122B43" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Restart the service</text><path d="M766 491v-136h28v136Z" fill="#1F6894"/><rect x="712" y="291" width="136" height="116" rx="22" fill="#D4ECFA" stroke="none" stroke-width="3.25"/><g transform="translate(780 348) scale(1.125)" fill="none" stroke="#122B43" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><rect x="-30" y="-15" width="60" height="30" rx="5"/><path d="M-10-15v30m20-30v30M-33 24h66"/></g><circle cx="780" cy="500" r="11" fill="#EAF2F8" stroke="#1F6894" stroke-width="3.5"/><text x="780" y="556" text-anchor="middle" fill="#122B43" font-size="25" font-weight="700" stroke="#122B43" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Replay on reconnect</text><path d="M1046 491v-136h28v136Z" fill="#1F6894"/><rect x="992" y="291" width="136" height="116" rx="22" fill="#D4ECFA" stroke="none" stroke-width="3.25"/><g transform="translate(1060 348) scale(1.125)" fill="none" stroke="#122B43" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M-13 0l9 10 17-19"/></g><circle cx="1060" cy="500" r="11" fill="#EAF2F8" stroke="#1F6894" stroke-width="3.5"/><text x="1060" y="556" text-anchor="middle" fill="#122B43" font-size="25" font-weight="700" stroke="#122B43" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Reconcile outcomes</text></g></svg>
