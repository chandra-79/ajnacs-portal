<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-label="A verification gate checks the digest and build provenance against producer policy. An authorized artifact can enter deployment, while a signed artifact from an unapproved workflow is rejected."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#F1D8E1"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#49202C" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="69" font-weight="700" stroke="#FFFFFF" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Authorize the build producer</text><path d="M80 154H1200" fill="none" stroke="#F1D8E1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#6E2945" stroke="none" stroke-width="3.25"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#FFFFFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M-24 27v-48h48v48M-13 27v-35H13v35M-31 27H31M-13-8l13 12L13-8"/></g><text x="255" y="454" text-anchor="middle" fill="#FFFFFF" font-size="35" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Provenance check</text><path d="M429 400H516V329H672" fill="none" stroke="#F1D8E1" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="255" width="521" height="148" rx="19" fill="#BFE8DF" stroke="none" stroke-width="3.25"/><g transform="translate(738 329) scale(1.015625)" fill="none" stroke="#214D46" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M-13 0l9 10 17-19"/></g><text x="788" y="325" text-anchor="start" fill="#214D46" font-size="45" font-weight="700" stroke="#214D46" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Authorized build</text><text x="788" y="357" text-anchor="start" fill="#214D46" font-size="32" font-weight="400">Permit deployment</text><path d="M429 400H538V491H672" fill="none" stroke="#F1D8E1" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="417" width="521" height="148" rx="19" fill="#6E2945" stroke="#A44361" stroke-width="3.25"/><g transform="translate(738 491) scale(1.015625)" fill="none" stroke="#FFFFFF" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 24-20v17c0 14-10 24-24 33C-14 21-24 11-24-3V-20Z M-10 0l7 7 14-15"/></g><text x="788" y="487" text-anchor="start" fill="#FFFFFF" font-size="37" font-weight="700" stroke="#FFFFFF" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Unapproved workflow</text><text x="788" y="519" text-anchor="start" fill="#FFFFFF" font-size="31" font-weight="400">Reject signed artifacts too</text><circle cx="429" cy="400" r="8" fill="#6E2945" stroke="#F1D8E1" stroke-width="3.5"/></g></svg>
