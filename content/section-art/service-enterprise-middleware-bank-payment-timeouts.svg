" cy="-8" r="15"/><path d="M0 1l25 25m-11-11 9-9m-4 14 9-9"/><circle cx="-15" cy="-11" r="4"/></g><text x="788" y="325" text-anchor="start" fill="#17392E" font-size="45" font-weight="700" stroke="#17392E" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Original retry key</text><text x="788" y="357" text-anchor="start" fill="#17392E" font-size="30" font-weight="400">Respect scope and lifetime</text><path d="M429 400H538V491H672" fill="none" stroke="#2C7762" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="417" width="521" height="148" rx="19" fill="#FDCF99" stroke="none" stroke-width="3.25"/><g transform="translate(738 491) scale(1.015625)" fill="none" stroke="#593819" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle cx="-5" cy="-5" r="18"/><path d="M8 8l18 18M-13-5h16m-8-8V3"/></g><text x="788" y="487" text-anchor="start" fill="#593819" font-size="45" font-weight="700" stroke="#593819" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Provider lookup</text><text x="788" y="519" text-anchor="start" fill="#593819" font-size="31" font-weight="400">Reconcile intent and result</text><circle cx="429" cy="400" r="8" fill="#174C3F" stroke="#2C7762" stroke-width="3.5"/></g></svg>
