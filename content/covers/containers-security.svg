<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Four complementary controls limit the container’s reach by restricting identity, runtime capabilities, root filesystem writes, and access to the host control socket."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#CDE9E0"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#17392E" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="70" font-weight="700">Shrink the container’s reach</text><path d="M80 154H1200" fill="none" stroke="#CDE9E0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="192" width="498" height="438" rx="32" fill="#174C3F" stroke="none" stroke-width="2.5"/><circle cx="329" cy="364" r="136" fill="#2C7762" stroke="none" stroke-width="3.5"/><circle cx="329" cy="364" r="112" fill="#174C3F" stroke="#CDE9E0" stroke-width="3.5"/><g transform="translate(329 364) scale(2.671875)" fill="none" stroke="#FDCF99" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 24-20v17c0 14-10 24-24 33C-14 21-24 11-24-3V-20Z M-10 0l7 7 14-15"/></g><text x="329" y="550" text-anchor="middle" fill="#FFFFFF" font-size="46" font-weight="700">Runtime privileges</text><text x="329" y="594" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="400">Drop unused capabilities</text><rect x="624" y="210" width="573" height="126" rx="19" fill="#174C3F" stroke="#2C7762" stroke-width="2.5"/><g transform="translate(686 273) scale(0.8125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="-12" cy="-8" r="15"/><path d="M0 1l25 25m-11-11 9-9m-4 14 9-9"/><circle cx="-15" cy="-11" r="4"/></g><text x="736" y="269" text-anchor="start" fill="#FFFFFF" font-size="31" font-weight="700">Workload identity</text><text x="736" y="301" text-anchor="start" fill="#FFFFFF" font-size="24" font-weight="400">Run as a non-root user</text><rect x="624" y="348" width="573" height="126" rx="19" fill="#174C3F" stroke="#2C7762" stroke-width="2.5"/><g transform="translate(686 411) scale(0.8125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-27" y="-23" width="54" height="46" rx="7"/><path d="M-27-9H27M-12-23v14"/></g><text x="736" y="407" text-anchor="start" fill="#FFFFFF" font-size="31" font-weight="700">Filesystem boundary</text><text x="736" y="439" text-anchor="start" fill="#FFFFFF" font-size="24" font-weight="400">Keep the root read-only</text><rect x="624" y="486" width="573" height="126" rx="19" fill="#174C3F" stroke="#2C7762" stroke-width="2.5"/><g transform="translate(686 549) scale(0.8125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-4-15 5-24a12 12 0 0117 17l-9 9a12 12 0 01-17 0m8 13-9 9a12 12 0 01-17-17l9-9a12 12 0 0117 0M-10 10l20-20"/></g><text x="736" y="545" text-anchor="start" fill="#FFFFFF" font-size="31" font-weight="700">Host control socket</text><text x="736" y="577" text-anchor="start" fill="#FFFFFF" font-size="24" font-weight="400">Never mount into workload</text></g></svg>
