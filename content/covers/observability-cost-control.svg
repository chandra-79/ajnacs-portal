<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Telemetry cost controls reserve high-cardinality identifiers for suitable trace context and keep aggregate metrics useful at lower cost."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#2C7762"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#EFF6F4" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#17392E" font-size="58" font-weight="700">Put cardinality in the right place</text><path d="M80 154H1200" fill="none" stroke="#2C7762" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#174C3F" stroke="none" stroke-width="2.5"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-28-19H12l16 14V19h-56Z M12-19V-5h16M-16-5H2m-18 10h26"/></g><text x="255" y="454" text-anchor="middle" fill="#FFFFFF" font-size="36" font-weight="700">Telemetry ingest</text><text x="255" y="501" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="400">Attribute volume to owners</text><path d="M429 400H505V266H672" fill="none" stroke="#2C7762" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="200" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#CDE9E0" stroke-width="2.5"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#17392E" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-28-27V26H29M-17 14h8V5h11v-13h10v7h9v-20h7"/></g><text x="788" y="261.5" text-anchor="start" fill="#17392E" font-size="31" font-weight="700">Aggregate metrics</text><te