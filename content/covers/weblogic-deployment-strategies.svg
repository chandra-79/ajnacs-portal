<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A versioned WebLogic rollout directs new sessions to the new application and keeps the retiring version available until its existing sessions drain."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#6746A5"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F4FB" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#261944" font-size="72" font-weight="700">Drain old WebLogic sessions</text><path d="M80 154H1200" fill="none" stroke="#6746A5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M89 500H1191" fill="none" stroke="#6746A5" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><path d="M206 491v-136h28v136Z" fill="#6746A5"/><rect x="152" y="291" width="136" height="116" rx="22" fill="#E9DFF7" stroke="none" stroke-width="2.5"/><g transform="translate(220 348) scale(1.125)" fill="none" stroke="#261944" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M0-16V0l12 8M0-26v3m26 23h-3M0 26v-3m-26-23h3"/></g><circle cx="220" cy="500" r="11" fill="#F4F4FB" stroke="#6746A5" stroke-width="3.5"/><text x="220" y="556" text-anchor="middle" fill="#261944" font-size="33" font-weight="700">Old version</text><text x="220" y="590" text-anchor="middle" fill="#261944" font-size="21" font-weight="400">Keeps existing sessions</text><path d="M486 491v-136h28v136Z" fill="#6746A5"/><rect x="432" y="291" width="136" height="116" rx="22" fill="#E9DFF7" stroke="none" stroke-width="2.5"/><g transform="translate(500 348) scale(1.125)" fill="none" stroke="#261944" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-