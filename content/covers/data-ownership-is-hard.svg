<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A data-product handover transfers access, quality, and change responsibilities, then rehearses who can make and communicate a real decision."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#3E6D37"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F7EF" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#20361B" font-size="54" font-weight="700">Transfer the decisions with the data</text><path d="M80 154H1200" fill="none" stroke="#3E6D37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#FDE09E" stroke="none" stroke-width="2.5"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#553813" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 14h60M-22 25v-46m44 46v-46M-30 7c24-23 36-23 60 0m-35-9v16m10-16v16"/></g><text x="255" y="454" text-anchor="middle" fill="#553813" font-size="36" font-weight="700">Working handover</text><text x="255" y="501" text-anchor="middle" fill="#553813" font-size="23" font-weight="400">Assign quality and access</text><path d="M429 400H516V329H672" fill="none" stroke="#3E6D37" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="255" width="521" height="148" rx="19" fill="#FFFFFF" stroke="#E0ECD7" stroke-width="2.5"/><g transform="translate(738 329) scale(1.015625)" fill="none" stroke="#20361B" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cy="-14" r="11"/><path d="M-22 25v-4a22 22 0 0144 0v4Z"/></g><text x="788" y="325" text-anchor="start" fill="#20361B" font-size="40" font-weight="700