<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Business modules share a deployment while explicit interfaces and data ownership keep one module from silently reaching into another."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#2C7762"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#EFF6F4" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#17392E" font-size="61" font-weight="700">One deployment, owned boundaries</text><path d="M80 154H1200" fill="none" stroke="#2C7762" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M135 202h953l32 19-32 19H135l-32-19Z" fill="#CDE9E0"/><rect x="93" y="214" width="1037" height="82" rx="19" fill="#FFFFFF" stroke="#CDE9E0" stroke-width="2.5"/><g transform="translate(155 255) scale(0.8125)" fill="none" stroke="#17392E" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-27" y="-23" width="54" height="46" rx="7"/><path d="M-27-9H27M-12-23v14"/></g><text x="205" y="251" text-anchor="start" fill="#17392E" font-size="31" font-weight="700">One deployment</text><text x="205" y="283" text-anchor="start" fill="#17392E" font-size="24" font-weight="400">Shared runtime</text><path d="M168 310h887l32 19-32 19H168l-32-19Z" fill="#CDE9E0"/><rect x="126" y="322" width="971" height="82" rx="19" fill="#FFFFFF" stroke="#CDE9E0" stroke-width="2.5"/><g transform="translate(188 363) scale(0.8125)" fill="none" stroke="#17392E" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-28l30 15L0 2l-30-15Z M-30 0 0 15 30 0 M-30 13 0 28 30 13"/></g><text x="238" y="359" text-anchor="start" fill="#17392E" font-size="31" font-weight="700">Business modules</text><text x="238" y="39