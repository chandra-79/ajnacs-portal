<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A published host port forwards external traffic to a container on a local bridge, where peers can find named services through Docker DNS."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#E1ECD9"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#273925" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="72" font-weight="700">Follow the container packet</text><path d="M80 154H1200" fill="none" stroke="#E1ECD9" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#F9BFA9" stroke="none" stroke-width="2.5"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#613321" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 14h60M-22 25v-46m44 46v-46M-30 7c24-23 36-23 60 0m-35-9v16m10-16v16"/></g><text x="255" y="454" text-anchor="middle" fill="#613321" font-size="41" font-weight="700">Bridge network</text><text x="255" y="501" text-anchor="middle" fill="#613321" font-size="23" font-weight="400">Connects local containers</text><path d="M429 400H505V266H672" fill="none" stroke="#E1ECD9" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="200" width="521" height="131" rx="19" fill="#2D4C35" stroke="#4B6E42" stroke-width="2.5"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="27"/><ellipse rx="11" ry="27"/><path d="M-27 0H27M-21-14h42m-42 28h42"/></g><text x="788" y="261.5" text-anchor="start" fill="#FFFFFF" font-size="31" font-weigh