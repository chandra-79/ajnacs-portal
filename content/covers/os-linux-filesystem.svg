<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Directory names point to inode metadata or mounted filesystems, while some paths expose device or kernel objects instead of ordinary on-disk contents."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#3E6D37"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F7EF" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#20361B" font-size="72" font-weight="700">Follow a path to its inode</text><path d="M80 154H1200" fill="none" stroke="#3E6D37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#FDE09E" stroke="none" stroke-width="2.5"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#553813" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-19 0H0m0 0v-20h19M0 0v20h19"/><circle cx="-24" r="6"/><circle cx="24" cy="-20" r="6"/><circle cx="24" cy="20" r="6"/></g><text x="255" y="454" text-anchor="middle" fill="#553813" font-size="38" font-weight="700">Path under root</text><text x="255" y="501" text-anchor="middle" fill="#553813" font-size="25" font-weight="400">Resolve directory names</text><path d="M429 400H505V266H672" fill="none" stroke="#3E6D37" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="200" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#E0ECD7" stroke-width="2.5"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#20361B" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="788" y="261.5" text-anchor=