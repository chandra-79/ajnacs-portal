"round" stroke-linejoin="round"><path d="M-24 27v-48h48v48M-13 27v-35H13v35M-31 27H31M-13-8l13 12L13-8"/></g><circle cx="500" cy="500" r="11" fill="#362018" stroke="#F4D9C6" stroke-width="3.5"/><text x="500" y="556" text-anchor="middle" fill="#FFFFFF" font-size="27" font-weight="700">Validate a request</text><text x="500" y="590" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="400">Check active session state</text><path d="M766 491v-152h28v152Z" fill="#F4D9C6"/><rect x="712" y="275" width="136" height="116" rx="22" fill="#DCE8A6" stroke="none" stroke-width="2.5"/><g transform="translate(780 332) scale(1.125)" fill="none" stroke="#3D4A17" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 24-20v17c0 14-10 24-24 33C-14 21-24 11-24-3V-20Z M-10 0l7 7 14-15"/></g><circle cx="780" cy="500" r="11" fill="#DCE8A6" stroke="#F4D9C6" stroke-width="3.5"/><text x="780" y="556" text-anchor="middle" fill="#FFFFFF" font-size="27" font-weight="700">Revoke the session</text><text x="780" y="590" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="400">Invalidate at the authority</text><path d="M1046 491v-136h28v136Z" fill="#F4D9C6"/><rect x="992" y="291" width="136" height="116" rx="22" fill="#703420" stroke="none" stroke-width="2.5"/><g transform="translate(1060 348) scale(1.125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-18 27v-53m0 2c20-15 24 15 42 0v29C6 20 2-10-18 5"/></g><circle cx="1060" cy="500" r="11" fill="#362018" stroke="#F4D9C6" stroke-width="3.5"/><text x="1060" y="556" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">Next protected request</text><text x="1060" y="590" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="400">Reject old session state</text></g></svg>
