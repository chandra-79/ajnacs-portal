<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="An unsettled topic forks toward an early position or a narrower open question that identifies what evidence would change the judgment."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#4B6E42"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F2F7EE" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#273925" font-size="72" font-weight="700">Leave the question open</text><path d="M80 154H1200" fill="none" stroke="#4B6E42" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#2D4C35" stroke="none" stroke-width="2.5"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-19 0H0m0 0v-20h19M0 0v20h19"/><circle cx="-24" r="6"/><circle cx="24" cy="-20" r="6"/><circle cx="24" cy="20" r="6"/></g><text x="255" y="454" text-anchor="middle" fill="#FFFFFF" font-size="32" font-weight="700">An unsettled topic</text><text x="255" y="501" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="400">Name what is unresolved</text><path d="M429 400H516V329H672" fill="none" stroke="#4B6E42" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="255" width="521" height="148" rx="19" fill="#FFFFFF" stroke="#E1ECD9" stroke-width="2.5"/><g transform="translate(738 329) scale(1.015625)" fill="none" stroke="#273925" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-24 27v-48h48v48M-13 27v-35H13v35M-31 27H31M-13-8l13 12L13-8"/></g><text x="788" y="325" text-anchor="start" fill="#273925" font-size="40" font-weight="700">Firm position</text><text x="788" y="357" text-anchor="start" fill="#273925" font-size="29" font-weight="400">Closes the search</text><path d="M429 400H538V491H672" fill="none" stroke="#4B6E42" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="417" width="521" height="148" rx="19" fill="#F9BFA9" stroke="none" stroke-width="2.5"/><g transform="translate(738 491) scale(1.015625)" fill="none" stroke="#613321" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><ellipse rx="12" ry="26"/><path d="M-26 0h52m-44-16h36m-36 32h36"/></g><text x="788" y="487" text-anchor="start" fill="#613321" font-size="40" font-weight="700">Smaller question</text><text x="788" y="519" text-anchor="start" fill="#613321" font-size="29" font-weight="400">Say what would settle it</text><circle cx="429" cy="400" r="8" fill="#2D4C35" stroke="#4B6E42" stroke-width="3.5"/></g></svg>
