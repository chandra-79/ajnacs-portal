<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A placement rule routes database keys to owners, while a rehearsed handoff shows how ownership changes during resharding."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#6746A5"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F4FB" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#261944" font-size="56" font-weight="700">Sharding moves the routing decision</text><path d="M80 154H1200" fill="none" stroke="#6746A5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#D6EF89" stroke="none" stroke-width="2.5"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#503F15" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-30 14h60M-22 25v-46m44 46v-46M-30 7c24-23 36-23 60 0m-35-9v16m10-16v16"/></g><text x="255" y="454" text-anchor="middle" fill="#503F15" font-size="32" font-weight="700">Resharding handoff</text><text x="255" y="501" text-anchor="middle" fill="#503F15" font-size="21" font-weight="400">Rehearse cutover and replay</text><path d="M429 400H516V329H672" fill="none" stroke="#6746A5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="255" width="521" height="148" rx="19" fill="#FFFFFF" stroke="#E9DFF7" stroke-width="2.5"/><g transform="translate(738 329) scale(1.015625)" fill="none" stroke="#261944" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="28"/><path d="M19-19 8 8l-27 11L-8-8ZM-28 0h5m46 0h5M0-28v5m0 46v5"/></g><text x="788" y="325" text-anchor="start" fill="#261944" font-size="40" font-weight="700">Placement rule</text><text x="788" y="357" text-anchor="start" fill="#261944" font-size="29" font-weight="400">Map each key to its shard</text><path d="M429 400H538V491H672" fill="none" stroke="#6746A5" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="417" width="521" height="148" rx="19" fill="#FFFFFF" stroke="#E9DFF7" stroke-width="2.5"/><g transform="translate(738 491) scale(1.015625)" fill="none" stroke="#261944" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-20" rx="24" ry="9"/><path d="M-24-20v39c0 12 48 12 48 0v-39m-48 13c0 12 48 12 48 0m-48 13c0 12 48 12 48 0"/></g><text x="788" y="487" text-anchor="start" fill="#261944" font-size="40" font-weight="700">Shard owners</text><text x="788" y="519" text-anchor="start" fill="#261944" font-size="29" font-weight="400">Keep placement metadata</text><circle cx="429" cy="400" r="8" fill="#D6EF89" stroke="#6746A5" stroke-width="3.5"/></g></svg>
