<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A decision weighs a managed capability's delivery and operations benefit against dependence, with a tested data export reducing uncertainty."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#9D5C22"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FBF4EB" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#46290F" font-size="65" font-weight="700">Trade portability deliberately</text><path d="M80 154H1200" fill="none" stroke="#9D5C22" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="195" width="264" height="412" rx="23" fill="#633D1B" stroke="none" stroke-width="2.5"/><rect x="99" y="315" width="226" height="165" rx="17" fill="#9D5C22" stroke="none" stroke-width="2.5"/><circle cx="312" cy="226" r="12" fill="#D8E9F6" stroke="none" stroke-width="3.5"/><text x="212" y="259" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="700">Managed capability</text><g transform="translate(212 399) scale(2.234375)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-28" y="-26" width="56" height="22" rx="5"/><rect x="-28" y="4" width="56" height="22" rx="5"/><path d="M-18-15h3m7 0h3m-13 30h3m7 0h3m12-30h11m-11 30h11"/></g><text x="212" y="526" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="400">Buy faster delivery</text><rect x="365" y="231" width="264" height="376" rx="23" fill="#FFFFFF" stroke="#EFDFC6" stroke-width="2.5"/><rect x="384" y="351" width="226" height="165" rx="17" fill="#EFDFC6" stroke="none" stroke-width="2.5"/><text x="497" y="295" text-anchor="middle" fill="#46290F" font-size="30" font-weight="700">Operating work</text><g transform="translate(497 435) scale(2.234375)" fill="none" stroke="#46290F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="12"/><path d="M-6-28h12l3 7 7 4 8-1 6 10-5 6v8l5 6-6 10-8-1-7 4-3 7H-6l-3-7-7-4-8 1-6-10 5-6v-8l-5-6 6-10 8 1 7-4Z"/></g><text x="497" y="562" text-anchor="middle" fill="#46290F" font-size="17" font-weight="400">Avoid maintaining it alone</text><rect x="650" y="195" width="264" height="412" rx="23" fill="#FFFFFF" stroke="#EFDFC6" stroke-width="2.5"/><rect x="669" y="315" width="226" height="165" rx="17" fill="#EFDFC6" stroke="none" stroke-width="2.5"/><text x="782" y="259" text-anchor="middle" fill="#46290F" font-size="23" font-weight="700">Bounded dependence</text><g transform="translate(782 399) scale(2.234375)" fill="none" stroke="#46290F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="782" y="526" text-anchor="middle" fill="#46290F" font-size="17" font-weight="400">Record why it is justified</text><rect x="935" y="231" width="264" height="376" rx="23" fill="#FFFFFF" stroke="#EFDFC6" stroke-width="2.5"/><rect x="954" y="351" width="226" height="165" rx="17" fill="#EFDFC6" stroke="none" stroke-width="2.5"/><text x="1067" y="295" text-anchor="middle" fill="#46290F" font-size="38" font-weight="700">Export path</text><g transform="translate(1067 435) scale(2.234375)" fill="none" stroke="#46290F" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-19 0H0m0 0v-20h19M0 0v20h19"/><circle cx="-24" r="6"/><circle cx="24" cy="-20" r="6"/><circle cx="24" cy="20" r="6"/></g><text x="1067" y="562" text-anchor="middle" fill="#46290F" font-size="20" font-weight="400">Prove recoverable data</text></g></svg>
