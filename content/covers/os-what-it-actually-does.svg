<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A user process crosses a system-call boundary so the kernel can mediate scheduling, memory, device and filesystem access."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#6746A5"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F4FB" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#261944" font-size="65" font-weight="700">What happens at a system call?</text><path d="M80 154H1200" fill="none" stroke="#6746A5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M135 202h953l32 19-32 19H135l-32-19Z" fill="#E9DFF7"/><rect x="93" y="214" width="1037" height="82" rx="19" fill="#FFFFFF" stroke="#E9DFF7" stroke-width="2.5"/><g transform="translate(155 255) scale(0.8125)" fill="none" stroke="#261944" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-14-16-30 0l16 16m28-32L30 0 14 16M7-23-7 23"/></g><text x="205" y="251" text-anchor="start" fill="#261944" font-size="31" font-weight="700">User process</text><text x="205" y="283" text-anchor="start" fill="#261944" font-size="24" font-weight="400">Requests an operation</text><path d="M168 310h887l32 19-32 19H168l-32-19Z" fill="#D6EF89"/><rect x="126" y="322" width="971" height="82" rx="19" fill="#D6EF89" stroke="none" stroke-width="2.5"/><g transform="translate(188 363) scale(0.8125)" fill="none" stroke="#503F15" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-24 27v-48h48v48M-13 27v-35H13v35M-31 27H31M-13-8l13 12L13-8"/></g><text x="238" y="359" text-anchor="start" fill="#503F15" font-size="31" font-weight="700">System call</text><text x="238" y="391" text-anchor="start" fill="#503F15" font-size="24" font-weight="400">Crosses the kernel boundary</text><path d="M201 418h821l32 19-32 19H201l-32-19Z" fill="#E9DFF7"/><rect x="159" y="430" width="905" height="82" rx="19" fill="#FFFFFF" stroke="#E9DFF7" stroke-width="2.5"/><g transform="translate(221 471) scale(0.8125)" fill="none" stroke="#261944" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-22" y="-22" width="44" height="44" rx="5"/><rect x="-10" y="-10" width="20" height="20" rx="3"/><path d="M-12-30v8m12-8v8m12-8v8M-12 22v8m12-8v8m12-8v8M-30-12h8m-8 12h8m-8 12h8m44-24h8m-8 12h8m-8 12h8"/></g><text x="271" y="467" text-anchor="start" fill="#261944" font-size="31" font-weight="700">Kernel resources</text><text x="271" y="499" text-anchor="start" fill="#261944" font-size="24" font-weight="400">Schedules and maps memory</text><path d="M234 526h755l32 19-32 19H234l-32-19Z" fill="#E9DFF7"/><rect x="192" y="538" width="839" height="82" rx="19" fill="#FFFFFF" stroke="#E9DFF7" stroke-width="2.5"/><g transform="translate(254 579) scale(0.8125)" fill="none" stroke="#261944" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-20" rx="24" ry="9"/><path d="M-24-20v39c0 12 48 12 48 0v-39m-48 13c0 12 48 12 48 0m-48 13c0 12 48 12 48 0"/></g><text x="304" y="575" text-anchor="start" fill="#261944" font-size="31" font-weight="700">Device or filesystem</text><text x="304" y="607" text-anchor="start" fill="#261944" font-size="24" font-weight="400">Returns bytes or status</text></g></svg>
