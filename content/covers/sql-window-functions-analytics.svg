<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A running SQL balance sums the window frame for each ordered event while preserving that event as its own output row."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#A94D37"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FAF0ED" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#3E221C" font-size="58" font-weight="700">Compute across rows, keep each row</text><path d="M80 154H1200" fill="none" stroke="#A94D37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M89 500H1191" fill="none" stroke="#A94D37" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><path d="M206 491v-136h28v136Z" fill="#A94D37"/><rect x="152" y="291" width="136" height="116" rx="22" fill="#F5E0D9" stroke="none" stroke-width="2.5"/><g transform="translate(220 348) scale(1.125)" fill="none" stroke="#3E221C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-25" y="-25" width="50" height="50" rx="5"/><path d="M-25 0h50M0-25v50"/></g><circle cx="220" cy="500" r="11" fill="#FAF0ED" stroke="#A94D37" stroke-width="3.5"/><text x="220" y="556" text-anchor="middle" fill="#3E221C" font-size="33" font-weight="700">Partition</text><text x="220" y="590" text-anchor="middle" fill="#3E221C" font-size="21" font-weight="400">Group one account's rows</text><path d="M486 491v-136h28v136Z" fill="#A94D37"/><rect x="432" y="291" width="136" height="116" rx="22" fill="#F5E0D9" stroke="none" stroke-width="2.5"/><g transform="translate(500 348) scale(1.125)" fill="none" stroke="#3E221C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M