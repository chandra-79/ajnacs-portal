<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Redis reads split into fast cache hits and misses or evictions, with a guarded origin fallback protecting the authoritative data."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#1F6894"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#EAF2F8" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#122B43" font-size="70" font-weight="700">Design for the cache failure</text><path d="M80 154H1200" fill="none" stroke="#1F6894" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#1A4864" stroke="none" stroke-width="2.5"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-28-19H12l16 14V19h-56Z M12-19V-5h16M-16-5H2m-18 10h26"/></g><text x="255" y="454" text-anchor="middle" fill="#FFFFFF" font-size="45" font-weight="700">Read request</text><text x="255" y="501" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="400">Try the Redis lookup</text><path d="M429 400H505V266H672" fill="none" stroke="#1F6894" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="200" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#D4ECFA" stroke-width="2.5"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#122B43" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6-31-24 6h21l-5 25L25-9H3Z"/></g><text x="788" y="261.5" text-anchor="start" fill="#122B43" font-size="31" font-weight="700">Hit</text><text x="788" y="293.5" text-anchor="start" fill="#122B43