<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="An ADR links the original context and trade-off to the conditions and later record that supersede it."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#A94D37"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FAF0ED" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#3E221C" font-size="65" font-weight="700">Record when the choice changes</text><path d="M80 154H1200" fill="none" stroke="#A94D37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M289 351H988" fill="none" stroke="#A94D37" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="143" y="275" width="154" height="152" rx="32" fill="#F5E0D9" stroke="none" stroke-width="2.5"/><g transform="translate(220 351) scale(1.515625)" fill="none" stroke="#3E221C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="220" y="486" text-anchor="middle" fill="#3E221C" font-size="37" font-weight="700">Context</text><text x="220" y="533" text-anchor="middle" fill="#3E221C" font-size="18" font-weight="400">State what triggered the ADR</text><rect x="423" y="275" width="154" height="152" rx="32" fill="#F5E0D9" stroke="none" stroke-width="2.5"/><g transform="translate(500 351) scale(1.515625)" fill="none" stroke="#3E221C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-19 0H0m0 0v-20h19M0 0v20h19"/><circle cx="-24" r="6"/><circle cx="24" cy="-20" r="6"/><circle cx="24" cy="20" r="6"/></g><text x="500" y="486" text-anchor="middle" fill="#3E221C" font-size="37" font-weight="700">Options</text><text x="500" y="533" text-anchor="middle" fill="#3E221C" font-size="19" font-weight="400">Show the real alternatives</text><path d="M402 343l15 8-15 8Z" fill="#A94D37"/><rect x="703" y="275" width="154" height="152" rx="32" fill="#F5E0D9" stroke="none" stroke-width="2.5"/><g transform="translate(780 351) scale(1.515625)" fill="none" stroke="#3E221C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 31 25h-62Z M0-9v16m0 9v1"/></g><text x="780" y="486" text-anchor="middle" fill="#3E221C" font-size="37" font-weight="700">Consequences</text><text x="780" y="533" text-anchor="middle" fill="#3E221C" font-size="26" font-weight="400">Name the downside</text><path d="M682 343l15 8-15 8Z" fill="#A94D37"/><rect x="983" y="275" width="154" height="152" rx="32" fill="#F9DF9E" stroke="none" stroke-width="2.5"/><g transform="translate(1060 351) scale(1.515625)" fill="none" stroke="#563C17" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-4-15 5-24a12 12 0 0117 17l-9 9a12 12 0 01-17 0m8 13-9 9a12 12 0 01-17-17l9-9a12 12 0 0117 0M-10 10l20-20"/></g><text x="1060" y="486" text-anchor="middle" fill="#3E221C" font-size="28" font-weight="700">Superseding record</text><text x="1060" y="533" text-anchor="middle" fill="#3E221C" font-size="24" font-weight="400">Link the new decision</text><path d="M80 584H1200" fill="none" stroke="#A94D37" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
