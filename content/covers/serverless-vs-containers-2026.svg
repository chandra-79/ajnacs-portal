<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="cover-title cover-description">
  <title id="cover-title">Same traffic. Different runtime.</title>
  <desc id="cover-description">The same bursty workload is replayed against on-demand functions and a warm container pool. After a quiet interval, the functions encounter a cold start. The warm container pool keeps capacity available throughout the interval.</desc>
  <defs>
    <clipPath id="compute-lanes"><rect x="58" y="168" width="1164" height="492" rx="24"/></clipPath>
    <pattern id="compute-idle" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 0v14" stroke="#CFDAEC" stroke-width="2"/>
    </pattern>
    <clipPath id="compute-capacity"><rect x="408" y="523" width="768" height="96" rx="10"/></clipPath>
  </defs>
  <rect width="1280" height="720" fill="#F5F8FE"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#182C54">
    <text x="62" y="113" font-size="61" font-weight="700" letter-spacing="-2">Same traffic. <tspan fill="#285FB4">Different runtime.</tspan></text>
    <rect x="58" y="168" width="1164" height="492" rx="24" fill="#FFFFFF"/>
    <g clip-path="url(#compute-lanes)">
      <path d="M58 168h313v492H58z" fill="#EAF0FA"/>
      <path d="M58 168h1164v145H58z" fill="#182C54"/>
      <path d="M58 488h1164v172H58z" fill="#F0F5FD"/>
      <path d="M58 488h313v172H58z" fill="#DFE8F8"/>
      <path d="M371 313v347M58 488h1164" fill="none" stroke="#CFDAEC" stroke-width="2"/>
    </g>
    <rect x="59" y="169" width="1162" height="490" rx="23" fill="none" stroke="#CFDAEC" stroke-width="2"/>
    <text x="87" y="253" font-size="33" font-weight="700" fill="#FFFFFF">Request load</text>
    <text x="87" y="389" font-size="38" font-weight="700">On-demand</text>
    <text x="87" y="434" font-size="38" font-weight="700">functions</text>
    <text x="87" y="561" font-size="38" font-weight="700">Warm</text>
    <text x="87" y="606" font-size="38" font-weight="700">containers</text>
    <path d="M408 273h42v-18h33v-23h40v12h38v29h207v-37h42v-36h61v20h52v31h44v22h61v-18h40v-14h40v32h68z" fill="#E0EBFF" opacity="0.24"/>
    <path d="M408 273h42v-18h33v-23h40v12h38v29h207v-37h42v-36h61v20h52v31h44v22h61v-18h40v-14h40v32h68" fill="none" stroke="#BCD8FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M562 274v344M768 274v344" fill="none" stroke="#AABAD4" stroke-width="2.5" stroke-dasharray="6 8"/>
    <path d="M408 456h768" stroke="#CFDAEC" stroke-width="3" stroke-linecap="round"/>
    <g fill="#285FB4">
      <rect x="450" y="433" width="30" height="23" rx="4"/><rect x="483" y="403" width="37" height="53" rx="4"/><rect x="523" y="417" width="35" height="39" rx="4"/>
      <rect x="810" y="407" width="58" height="49" rx="4"/><rect x="871" y="385" width="49" height="71" rx="4"/><rect x="923" y="423" width="41" height="33" rx="4"/>
      <rect x="1028" y="434" width="37" height="22" rx="4"/><rect x="1068" y="415" width="37" height="41" rx="4"/>
    </g>
    <rect x="768" y="429" width="42" height="27" rx="4" fill="#FFBEA0" stroke="#A44628" stroke-width="3"/>
    <path d="M730 364h24v50h34v15" fill="none" stroke="#A44628" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="724" y="373" text-anchor="end" font-size="31" font-weight="700" fill="#A44628">Cold start</text>
    <rect x="408" y="523" width="768" height="96" rx="10" fill="#E0EBFF"/>
    <g clip-path="url(#compute-capacity)">
      <path d="M408 619h42v-23h33v-30h40v14h38v39h207v-39h42v-29h61v18h52v32h44v18h61v-22h40v-17h40v39h68v6H408z" fill="#285FB4"/>
      <path d="M562 524h206v95H562z" fill="url(#compute-idle)"/>
    </g>
    <rect x="408" y="523" width="768" height="96" rx="10" fill="none" stroke="#182C54" stroke-width="5"/>
    <rect x="571" y="550" width="188" height="43" rx="7" fill="#E0EBFF"/>
    <text x="665" y="582" text-anchor="middle" font-size="29" font-weight="700">Idle capacity</text>
