<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="An asynchronous FastAPI path yields while waiting on I/O, unlike blocking work; deployment limits also account for database pools on all workers."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#E6E0F5"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#282445" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="61" font-weight="700">Free the worker during I/O waits</text><path d="M80 154H1200" fill="none" stroke="#E6E0F5" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="195" width="264" height="412" rx="23" fill="#3A3457" stroke="none" stroke-width="2.5"/><rect x="99" y="315" width="226" height="165" rx="17" fill="#655A91" stroke="none" stroke-width="2.5"/><circle cx="312" cy="226" r="12" fill="#BEEDE0" stroke="none" stroke-width="3.5"/><text x="212" y="259" text-anchor="middle" fill="#FFFFFF" font-size="39" font-weight="700">Async I/O</text><g transform="translate(212 399) scale(2.234375)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6-31-24 6h21l-5 25L25-9H3Z"/></g><text x="212" y="526" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="400">Yield during outside calls</text><rect x="365" y="231" width="264" height="376" rx="23" fill="#3A3457" stroke="#E6E0F5" stroke-width="2.5"/><rect x="384" y="351" width="226" height="165" rx="17" fill="#282445" stroke="none" stroke-width="2.5"/><text x="497" y="295" text-anchor="middle" fill="#FFFFFF" font-size="23" font-weight="700">Blocking operation</text><g transform="translate(497 435) scale(2.234375)" fill="none" stroke="#E6E0F5" stroke-width="2.