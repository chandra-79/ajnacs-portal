<svg data-article-art="deep-performance-mergeable-latency-percentiles" xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Sum counts at matching histogram boundaries before locating the percentile. The enclosing bucket defines the precision of the estimate." width="100%" height="100%" preserveAspectRatio="xMidYMid slice"><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#A0482C"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FAF5EB" stroke="none" stroke-width="3.25"/><g font-family="Inter, sans-serif"><text x="77" y="119" text-anchor="start" fill="#362018" font-size="69" font-weight="700" stroke="#362018" stroke-width="1.7" stroke-linejoin="round" paint-order="stroke">Merge counts before reading p95</text><path d="M80 154H1200" fill="none" stroke="#A0482C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M336 351H941" fill="none" stroke="#A0482C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="190" y="275" width="154" height="152" rx="32" fill="#F4D9C6" stroke="none" stroke-width="3.25"/><g transform="translate(267 351) scale(1.515625)" fill="none" stroke="#362018" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><rect x="-25" y="-25" width="50" height="50" rx="5"/><path d="M-25 0h50M0-25v50"/></g><text x="267" y="486" text-anchor="middle" fill="#362018" font-size="35" font-weight="700" stroke="#362018" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Instance histograms</text><text x="267" y="533" text-anchor="middle" fill="#362018" font-size="28" font-weight="400">Same buckets and scope</text><rect x="563" y="275" width="154" height="152" rx="32" fill="#DCE8A6" stroke="none" stroke-width="3.25"/><g transform="translate(640 351) scale(1.515625)" fill="none" stroke="#3D4A17" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><path d="M0-28l30 15L0 2l-30-15Z M-30 0 0 15 30 0 M-30 13 0 28 30 13"/></g><text x="640" y="486" text-anchor="middle" fill="#362018" font-size="31" font-weight="700" stroke="#362018" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Sum matching buckets</text><text x="640" y="533" text-anchor="middle" fill="#362018" font-size="28" font-weight="400">Keep all eligible requests</text><path d="M542 343l15 8-15 8Z" fill="#A0482C"/><rect x="936" y="275" width="154" height="152" rx="32" fill="#F4D9C6" stroke="none" stroke-width="3.25"/><g transform="translate(1013 351) scale(1.515625)" fill="none" stroke="#362018" stroke-width="3.45" stroke-linecap="round" stroke-linejoin="round"><circle r="27"/><circle r="17"/><circle r="7"/></g><text x="1013" y="486" text-anchor="middle" fill="#362018" font-size="37" font-weight="700" stroke="#362018" stroke-width="0.95" stroke-linejoin="round" paint-order="stroke">Locate percentile</text><text x="1013" y="533" text-anchor="middle" fill="#362018" font-size="27" font-weight="400">Report its enclosing range</text><path d="M80 584H1200" fill="none" stroke="#A0482C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
