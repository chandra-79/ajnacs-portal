<svg xmlns="http://www.w3.org/2000/svg" data-article-art="event-sourcing-cqrs" role="img" aria-label="An accepted domain command appends a historical event, which can be replayed into a read projection or restored from a valid snapshot." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="An accepted domain command appends a historical event, which can be replayed into a read projection or restored from a valid snapshot."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#2C7762"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#EFF6F4" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#17392E" font-size="68" font-weight="700">An event is a historical fact</text><path d="M80 154H1200" fill="none" stroke="#2C7762" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#FDCF99" stroke="none" stroke-width="2.5"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#593819" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-14-16-30 0l16 16m28-32L30 0 14 16M7-23-7 23"/></g><text x="255" y="454" text-anchor="middle" fill="#593819" font-size="41" font-weight="700">Domain command</text><text x="255" y="501" text-anchor="middle" fill="#593819" font-size="24" font-weight="400">Decide whether to accept</text><path d="M429 400H505V266H672" fill="none" stroke="#2C7762" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="200" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#CDE9E0" stroke-width="2.5"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#17392E" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-17c-7-8-18-10-30-7v45C-18 18-7 20 0 28c7-8 18-10 30-7v-45C18-27 7-25 0-17Zm0 0v45m-22-43c5 0 10 1 14 4m16 0c4-3 9-4 14-4"/></g><text x="788" y="261.5" text-anchor="start" fill="#17392E" font-size="31" font-weight="700">Event append</text><text x="788" y="293.5" text-anchor="start" fill="#17392E" font-size="24" font-weight="400">Preserve the accepted fact</text><path d="M429 400H527V411H672" fill="none" stroke="#2C7762" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="345" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#CDE9E0" stroke-width="2.5"/><g transform="translate(738 410.5) scale(0.8125)" fill="none" stroke="#17392E" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-25" y="-25" width="50" height="50" rx="5"/><path d="M-25 0h50M0-25v50"/></g><text x="788" y="406.5" text-anchor="start" fill="#17392E" font-size="31" font-weight="700">Projection</text><text x="788" y="438.5" text-anchor="start" fill="#17392E" font-size="24" font-weight="400">Rebuild a read model</text><path d="M429 400H549V556H672" fill="none" stroke="#2C7762" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="490" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#CDE9E0" stroke-width="2.5"/><g transform="translate(738 555.5) scale(0.8125)" fill="none" stroke="#17392E" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M0-16V0l12 8M0-26v3m26 23h-3M0 26v-3m-26-23h3"/></g><text x="788" y="551.5" text-anchor="start" fill="#17392E" font-size="31" font-weight="700">Snapshot</text><text x="788" y="583.5" text-anchor="start" fill="#17392E" font-size="24" font-weight="400">Advance only when valid</text><circle cx="429" cy="400" r="8" fill="#FDCF99" stroke="#2C7762" stroke-width="3.5"/></g></svg>
