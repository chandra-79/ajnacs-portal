ke="none" stroke-width="2.5"/><g transform="translate(500 351) scale(1.515625)" fill="none" stroke="#49202C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="-12" cy="-8" r="15"/><path d="M0 1l25 25m-11-11 9-9m-4 14 9-9"/><circle cx="-15" cy="-11" r="4"/></g><text x="500" y="486" text-anchor="middle" fill="#49202C" font-size="29" font-weight="700">Expired cache key</text><text x="500" y="533" text-anchor="middle" fill="#49202C" font-size="26" font-weight="400">Coordinate the miss</text><path d="M402 343l15 8-15 8Z" fill="#A44361"/><rect x="703" y="275" width="154" height="152" rx="32" fill="#BFE8DF" stroke="none" stroke-width="2.5"/><g transform="translate(780 351) scale(1.515625)" fill="none" stroke="#214D46" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-24 27v-48h48v48M-13 27v-35H13v35M-31 27H31M-13-8l13 12L13-8"/></g><text x="780" y="486" text-anchor="middle" fill="#49202C" font-size="28" font-weight="700">Single-flight fill</text><text x="780" y="533" text-anchor="middle" fill="#49202C" font-size="24" font-weight="400">One fetch from origin</text><path d="M682 343l15 8-15 8Z" fill="#A44361"/><rect x="983" y="275" width="154" height="152" rx="32" fill="#F1D8E1" stroke="none" stroke-width="2.5"/><g transform="translate(1060 351) scale(1.515625)" fill="none" stroke="#49202C" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-28l30 15L0 2l-30-15Z M-30 0 0 15 30 0 M-30 13 0 28 30 13"/></g><text x="1060" y="486" text-anchor="middle" fill="#49202C" font-size="33" font-weight="700">Shared response</text><text x="1060" y="533" text-anchor="middle" fill="#49202C" font-size="24" font-weight="400">Serve waiting readers</text><path d="M80 584H1200" fill="none" stroke="#A44361" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
