<svg xmlns="http://www.w3.org/2000/svg" data-article-art="quantum-computing-race-2025" role="img" aria-label="Three illustrations compare the evidence from quantum circuit sampling, surface-code error correction, and annealing: an output distribution, a logical error rate, and a solution’s energy." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">What do quantum tests measure?</title>
  <desc id="desc">Circuit sampling produces a distribution of outputs, error correction measures logical errors, and annealing seeks low-energy solutions. The three diagrams are conceptual.</desc>
