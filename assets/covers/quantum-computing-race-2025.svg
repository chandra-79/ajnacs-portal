  <text x="59" y="119" fill="#26203E" font-family="Arial, sans-serif" font-size="67" font-weight="700" letter-spacing="-2.65">What do quantum tests measure?</text>
  <path d="M60 147h1160" stroke="#D3CBE3" stroke-width="3"/>

