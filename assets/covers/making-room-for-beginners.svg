<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-article-art="making-room-for-beginners" role="img" aria-label="Concept diagram: Show the local map — Explain owners, help routes, and boundaries.; Keep the learner active — Let them predict, act, and interpret.; Notice recurring gaps — Separate teaching needs from broken instructions.; Repair the path — Review changes with an established owner.; Repeat independently — Use a fresh walkthrough to check clarity.."><rect x="-1280" y="-720" width="3840" height="2160" fill="#f3f6fa"/><g font-family="Inter, sans-serif"><text x="62" y="76" font-size="34" font-weight="700" fill="#243651" text-anchor="start"><tspan x="62" dy="0">Make room for the beginner in the room</tspan></text><text x="62" y="159" font-size="23" font-weight="400" fill="#64748b" text-anchor="start"><tspan x="62" dy="0">Conceptual model · Follow the reasoning</tspan></text><rect x="62" y="233" width="206.4" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="62" y="233" width="206.4" height="8" rx="4" fill="#206c68"/><circle cx="95" cy="275" r="17" fill="#206c68"/><text x="95" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="95" dy="0">1</tspan></text><text x="82" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="82" dy="0">Show the</tspan><tspan x="82" dy="31.200000000000003">local map</tspan></text><text x="82" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="82" dy="0">Explain owners,</tspan><tspan x="82" dy="27.3">help routes,</tspan><tspan x="82" dy="27.3">and boundaries.</tspan></text><path d="M272.4 367H292.4m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="299.4" y="233" width="206.4" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="299.4" y="233" width="206.4" height="8" rx="4" fill="#306cb3"/><circle cx="332.4" cy="275" r="17