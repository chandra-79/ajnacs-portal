<svg xmlns="http://www.w3.org/2000/svg" data-article-art="reserved-instances-are-commitments" role="img" aria-label="A fictional seventy-cent hourly commitment breaks even at seventy percent utilization against a one-dollar on-demand rate and costs more at sixty percent." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A fictional seventy-cent hourly commitment breaks even at seventy percent utilization against a one-dollar on-demand rate and costs more at sixty percent."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#1F6894"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#EAF2F8" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#122B43" font-size="63" font-weight="700">The discount needs enough usage</text><path d="M80 154H1200" fill="none" stroke="#1F6894" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M89 500H1191" fill="none" stroke="#1F6894" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><path d="M253 491v-146h28v146Z" fill="#1F6894"/><rect x="199" y="281" width="136" height="116" rx="22" fill="#D4ECFA" stroke="none" stroke-width="2.5"/><g transform="translate(267 338) scale(1.125)" fill="none" stroke="#122B43" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="-12" cy="-8" r="15"/><path d="M0 1l25 25m-11-11 9-9m-4 14 9-9"/><circle cx="-15" cy="-11" r="4"/></g><circle cx="267" cy="500" r="11" fill="#EAF2F8" stroke="#1F6894" stroke-width="3.5"/><text x="267" y="556" text-anchor="middle" fill="#122B43" font-size="33" font-weight="700">Fixed commitment</text><text x="267" y="590" text-anchor="middle" fill="#12