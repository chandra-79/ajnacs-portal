" stroke-width="2.5"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#411F44" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cy="-14" r="11"/><path d="M-22 25v-4a22 22 0 0144 0v4Z"/></g><text x="788" y="261.5" text-anchor="start" fill="#411F44" font-size="31" font-weight="700">OIDC ID token</text><text x="788" y="293.5" text-anchor="start" fill="#411F44" font-size="24" font-weight="400">Identify the user to the app</text><path d="M429 400H527V411H672" fill="none" stroke="#8A4C82" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="345" width="521" height="131" rx="19" fill="#F7DE9A" stroke="none" stroke-width="2.5"/><g transform="translate(738 410.5) scale(0.8125)" fill="none" stroke="#563F11" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-24 27v-48h48v48M-13 27v-35H13v35M-31 27H31M-13-8l13 12L13-8"/></g><text x="788" y="406.5" text-anchor="start" fill="#563F11" font-size="31" font-weight="700">OAuth access token</text><text x="788" y="438.5" text-anchor="start" fill="#563F11" font-size="24" font-weight="400">Authorize calls to the API</text><path d="M429 400H549V556H672" fill="none" stroke="#8A4C82" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="490" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#EDDAEE" stroke-width="2.5"/><g transform="translate(738 555.5) scale(0.8125)" fill="none" stroke="#411F44" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 24-20v17c0 14-10 24-24 33C-14 21-24 11-24-3V-20Z M-10 0l7 7 14-15"/></g><text x="788" y="551.5" text-anchor="start" fill="#411F44" font-size="31" font-weight="700">Audience validation</text><text x="788" y="583.5" text-anchor="start" fill="#411F44" font-size="24" font-weight="400">Reject the wrong recipient</text><circle cx="429" cy="400" r="8" fill="#5C2B60" stroke="#8A4C82" stroke-width=