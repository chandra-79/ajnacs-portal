<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-article-art="keeping-small-promises" role="img" aria-label="Concept diagram: Make the promise clear — Name the result, timing, and boundary.; Expose the dependency — Show what another person is waiting for.; Update before surprise — Share changes while options remain.; Close or renegotiate — Confirm completion, cancellation, or a new plan.."><rect width="1280" height="720" fill="#f3f6fa"/><g font-family="Inter, sans-serif"><text x="62" y="76" font-size="34" font-weight="700" fill="#243651" text-anchor="start"><tspan x="62" dy="0">The small promises people build their work around</tspan></text><text x="62" y="159" font-size="23" font-weight="400" fill="#64748b" text-anchor="start"><tspan x="62" dy="0">Conceptual model · Follow the reasoning</tspan></text><rect x="62" y="233" width="265.75" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="62" y="233" width="265.75" height="8" rx="4" fill="#206c68"/><circle cx="95" cy="275" r="17" fill="#206c68"/><text x="95" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="95" dy="0">1</tspan></text><text x="82" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="82" dy="0">Make the promise</tspan><tspan x="82" dy="31.200000000000003">clear</tspan></text><text x="82" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="82" dy="0">Name the result,</tspan><tspan x="82" dy="27.3">timing, and</tspan><tspan x="82" dy="27.3">boundary.</tspan></text><path d="M331.75 367H351.75m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="358.75" y="233" width="265.75" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="358.75" y="233" width="265.75" height="8" rx="4" fill="#306cb3"/><circle cx="391.75" cy="275" r="17" fill="#306cb3"/><text x="391.75" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="391.75" dy="0">2</tspan></text><text x="378.75" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="378.75" dy="0">Expose the</tspan><tspan x="378.75" dy="31.200000000000003">dependency</tspan></text><text x="378.75" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="378.75" dy="0">Show what another</tspan><tspan x="378.75" dy="27.3">person is waiting</tspan><tspan x="378.75" dy="27.3">for.</tspan></text><path d="M628.5 367H648.5m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="655.5" y="233" width="265.75" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="655.5" y="233" width="265.75" height="8" rx="4" fill="#986527"/><circle cx="688.5" cy="275" r="17" fill="#986527"/><text x="688.5" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="688.5" dy="0">3</tspan></text><text x="675.5" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="675.5" dy="0">Update before</tspan><tspan x="675.5" dy="31.200000000000003">surprise</tspan></text><text x="675.5" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="675.5" dy="0">Share changes while</tspan><tspan x="675.5" dy="27.3">options remain.</tspan></text><path d="M925.25 367H945.25m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="952.25" y="233" width="265.75" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="952.25" y="233" width="265.75" height="8" rx="4" fill="#67529b"/><circle cx="985.25" cy="275" r="17" fill="#67529b"/><text x="985.25" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="985.25" dy="0">4</tspan></text><text x="972.25" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="972.25" dy="0">Close or</tspan><tspan x="972.25" dy="31.200000000000