<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-article-art="incident-communication" role="img" aria-label="Five steps connect observed impact to audience-specific updates and later corrections."><rect x="-1280" y="-720" width="3840" height="2160" fill="#f3f6fa"/><g font-family="Inter, sans-serif"><text x="62" y="76" font-size="34" font-weight="700" fill="#243651" text-anchor="start"><tspan x="62" dy="0">A useful incident update starts from shared evidence</tspan></text><text x="62" y="159" font-size="23" font-weight="400" fill="#64748b" text-anchor="start"><tspan x="62" dy="0">Conceptual model · Follow the reasoning</tspan></text><rect x="62" y="233" width="206.4" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="62" y="233" width="206.4" height="8" rx="4" fill="#206c68"/><circle cx="95" cy="275" r="17" fill="#206c68"/><text x="95" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="95" dy="0">1</tspan></text><text x="82" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="82" dy="0">Observe</tspan><tspan x="82" dy="31.200000000000003">impact</tspan></text><text x="82" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="82" dy="0">Record affected</tspan><tspan x="82" dy="27.3">journeys and</tspan><tspan x="82" dy="27.3">known scope</tspan></text><path d="M272.4 367H292.4m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="299.4" y="233" width="206.4" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="299.4" y="233" width="206.4" height="8" rx="4" fill="#306cb3"/><circle cx="332.4" cy="275" r="17" fill="#306cb3"/><text x="332.4" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="332.4" dy="0">2</tspan></text><text x="319.4" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="319.4" dy="0">Confirm the</tspan><tspan x="319.4" dy="31.200000000000003">current</tspan><tspan x="319.4" dy="31.200000000000003">state</tspan></text><text x="319.4" y="434.4" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="319.4" dy="0">Separate facts,</tspan><tspan x="319.4" dy="27.3">hypotheses and</tspan><tspan x="319.4" dy="27.3">attempted</tspan><tspan x="319.4" dy="27.3">actions</tspan></text><path d="M509.79999999999995 367H529.8m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="536.8" y="233" width="206.4" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="536.8" y="233" width="206.4" height="8" rx="4" fill="#986527"/><circle cx="569.8" cy="275" r="17" fill="#986527"/><text x="569.8" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="569.8" dy="0">3</tspan></text><text x="556.8" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="556.8" dy="0">Assign the</tspan><tspan x="556.8" dy="31.200000000000003">audience</tspan></text><text x="556.8" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="556.8" dy="0">Responders and</tspan><tspan x="556.8" dy="27.3">users need</tspan><tspan x="556.8" dy="27.3">different</tspan><tspan x="556.8" dy="27.3">details</tspan></text><path d="M747.2 367H767.2m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="774.2" y="233" width="206.4" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="774.2" y="233" width="206.4" height="8" rx="4" fill="#67529b"/><circle cx="807.2" cy="275" r="17" fill="#67529b"/><text x="807.2" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="807.2" dy="0">4</tspan></text><text x="794.2" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="794.2" dy="0">Publish the</tspan><tspan x="794.2" dy="31.200000000000003">next update</tspan></text><text x="794.2" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="794.2" dy="0">Include status</tspan><tspan x="794.2" dy="27.3">and a specific</tspan><tspan x="794.2" dy="27.3">update</tspan><tspan x="794.2" dy="27.3">commitment</tspan></text><path d="M984.6 367H1004.6m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="1011.6" y="233" width="206.4" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="1011.6" y="233" width="206.4" height="8" rx="4" fill="#a34f4f"/><circle cx="1044.6" cy="275" r="17" fill="#a34f4f"/><text x="1044.6" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="1044.6" dy="0">5</tspan></text><text x="1031.6" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="1031.6" dy="0">Revise as</tspan><tspan x="1031.6" dy="31.200000000000003">evidence</tspan><tspan x="1031.6" dy="31.200000000000003">changes</tspan></text><text x="1031.6" y="434.4" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="1031.6" dy="0">Correct scope</tspan><tspan x="1031.6" dy="27.3">and preserve</tspan><tspan x="1031.6" dy="27.3">unresolved work</tspan></text><text x="62" y="682" font-size="19" font-weight="400" fill="#64748b" text-anchor="start"><tspan x="62" dy="0">AJNA / Method, assumptions and values accompany the article.</tspan></text></g></svg>