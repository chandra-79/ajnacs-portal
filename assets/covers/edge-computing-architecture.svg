<svg xmlns="http://www.w3.org/2000/svg" data-article-art="edge-computing-architecture" role="img" aria-label="An edge design separates CDN execution, regional compute, and a disconnected site that must buffer events and catch up when links return." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="An edge design separates CDN execution, regional compute, and a disconnected site that must buffer events and catch up when links return."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#ECDFCF"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#392E23" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="61" font-weight="700">Place the decision near its data</text><path d="M80 154H1200" fill="none" stroke="#ECDFCF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M135 202h953l32 19-32 19H135l-32-19Z" fill="#544233"/><rect x="93" y="214" width="1037" height="82" rx="19" fill="#544233" stroke="#846448" stroke-width="2.5"/><g transform="translate(155 255) scale(0.8125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="27"/><ellipse rx="11" ry="27"/><path d="M-27 0H27M-21-14h42m-42 28h42"/></g><text x="205" y="251" text-anchor="start" fill="#FFFFFF" font-size="31" font-weight="700">CDN edge</text><text x="205" y="283" text-anchor="start" fill="#FFFFFF" font-size="24" font-weight="400">Serve cacheable requests</text><path d="M168 310h887l32 19-32 19H168l-32-19Z" fill="#544233"/><rect x="126" y="322" width="971" height="82" rx="19" fill="#544233" stroke="#846448" stroke-width="2.5"/><g transform="translate(188 363) scale(0.8125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-20" rx="24" ry="9"/><path d="M-24-20v39c0 12 48 12 48 0v-39m-48 13c0 12 48 12 48 0m-48 13c0 12 48 12 48 0"/></g><text x="238" y="359" text-anchor="start" fill="#FFFFFF" font-size="31" font-weight="700">Region</text><text x="238" y="391" text-anchor="start" fill="#FFFFFF" font-size="24" font-weight="400">Keep shared durable state</text><path d="M201 418h821l32 19-32 19H201l-32-19Z" fill="#CAE6DC"/><rect x="159" y="430" width="905" height="82" rx="19" fill="#CAE6DC" stroke="none" stroke-width="2.5"/><g transform="translate(221 471) scale(0.8125)" fill="none" stroke="#214539" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-30" y="-15" width="60" height="30" rx="5"/><path d="M-10-15v30m20-30v30M-33 24h66"/></g><text x="271" y="467" text-anchor="start" fill="#214539" font-size="31" font-weight="700">Disconnected site</text><text x="271" y="499" text-anchor="start" fill="#214539" font-size="24" font-weight="400">Decide locally and buffer</text><path d="M234 526h755l32 19-32 19H234l-32-19Z" fill="#544233"/><rect x="192" y="538" width="839" height="82" rx="19" fill="#544233" stroke="#846448" stroke-width="2.5"/><g transform="translate(254 579) scale(0.8125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-4-15 5-24a12 12 0 0117 17l-9 9a12 12 0 01-17 0m8 13-9 9a12 12 0 01-17-17l9-9a12 12 0 0117 0M-10 10l20-20"/></g><text x="304" y="575" text-anchor="start" fill="#FFFFFF" font-size="31" font-weight="700">Return of link</text><text x="304" y="607" text-anchor="start" fill="#FFFFFF" font-size="24" font-weight="400">Catch up after reconnect</text></g></svg>
</svg>