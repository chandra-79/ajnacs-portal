<svg xmlns="http://www.w3.org/2000/svg" data-article-art="quick-take-ai-governance" role="img" aria-label="A written AI policy becomes a control with a named decision-maker, test evidence, and a rehearsed stop or escalation path." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A written AI policy becomes a control with a named decision-maker, test evidence, and a rehearsed stop or escalation path."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#DDE9EF"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#1C3440" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="59" font-weight="700">Turn a policy into a release gate</text><path d="M80 154H1200" fill="none" stroke="#DDE9EF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M289 351H988" fill="none" stroke="#DDE9EF" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="143" y="275" width="154" height="152" rx="32" fill="#274F60" stroke="none" stroke-width="2.5"/><g transform="translate(220 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="220" y="486" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">Policy requirement</text><text x="220" y="533" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="400">Name the protected action</text><rect x="423" y="275" width="154" height="152" rx="32" fill="#274F60" stroke="none" stroke-width="2.5"/><g transform="translate(500 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cy="-14" r="11"/><path d="M-22 25v-4a22 22 0 0144 0v4Z"/></g><text x="500" y="486" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">Decision authority</text><text x="500" y="533" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="400">Assign an accountable role</text><path d="M402 343l15 8-15 8Z" fill="#DDE9EF"/><rect x="703" y="275" width="154" height="152" rx="32" fill="#F8CB90" stroke="none" stroke-width="2.5"/><g transform="translate(780 351) scale(1.515625)" fill="none" stroke="#5D3917" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-24 27v-48h48v48M-13 27v-35H13v35M-31 27H31M-13-8l13 12L13-8"/></g><text x="780" y="486" text-anchor="middle" fill="#FFFFFF" font-size="33" font-weight="700">Release control</text><text x="780" y="533" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="400">Require evidence to pass</text><path d="M682 343l15 8-15 8Z" fill="#DDE9EF"/><rect x="983" y="275" width="154" height="152" rx="32" fill="#274F60" stroke="none" stroke-width="2.5"/><g transform="translate(1060 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 31 25h-62Z M0-9v16m0 9v1"/></g><text x="1060" y="486" text-anchor="middle" fill="#FFFFFF" font-size="31" font-weight="700">Stop or escalate</text><text x="1060" y="533" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="400">Rehearse the path</text><path d="M80 584H1200" fill="none" stroke="#DDE9EF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
