<svg xmlns="http://www.w3.org/2000/svg" data-article-art="os-kernel-tuning-sysctl" role="img" aria-label="A sysctl change is recorded and tested at runtime against a repeatable baseline before it is persisted or reverted." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A sysctl change is recorded and tested at runtime against a repeatable baseline before it is persisted or reverted."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#DDE9EF"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#1C3440" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="50" font-weight="700">Test a kernel setting before persisting</text><path d="M80 154H1200" fill="none" stroke="#DDE9EF" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M89 500H1191" fill="none" stroke="#DDE9EF" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><path d="M206 491v-136h28v136Z" fill="#DDE9EF"/><rect x="152" y="291" width="136" height="116" rx="22" fill="#274F60" stroke="none" stroke-width="2.5"/><g transform="translate(220 348) scale(1.125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><circle cx="220" cy="500" r="11" fill="#1C3440" stroke="#DDE9EF" stroke-width="3.5"/><text x="220" y="556" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">Record the old value</text><text x="220" y="590" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="400">Capture workload baseline</text><path d="M486 491v-136h28v136Z" fill="#