<svg xmlns="http://www.w3.org/2000/svg" data-article-art="finops-chargeback-maturity" role="img" aria-label="An illustrative $6,000 shared logging cost follows ingestion volume into two team totals, which reconcile with direct costs to $18,000." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1280 720" role="img" aria-labelledby="finops-title finops-description">
  <title id="finops-title">Trace every cloud charge</title>
  <desc id="finops-description">In this illustrative FinOps allocation, Team A's 300 GB of logs attracts $4,500 of the $6,000 shared logging pool, while Team B's 100 GB attracts $1,500. Add each team's direct cost to charge Team A $12,500 and Team B $5,500, reconciling to the $18,000 invoice.</desc>
  <rect width="1280" height="720" fill="#FFF7F0"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="60" y="106" font-size="70" font-weight="700" letter-spacing="-2.9" fill="#233C32">Trace every cloud charge</text>
    <text x="64" y="155" font-size="32" font-weight="700" fill="#713B2D">Shared logging split by ingestion volume</text>
    <text x="1217" y="155" text-anchor="end" font-size="27" font-weight="700" fill="#713B2D">Illustrative allocation</text>
    <path d="M63 183H1217" fill="none" stroke="#D7BFB1" stroke-width="2"/>

    <!-- Ribbon widths are proportional to dollars at $83.33 per SVG unit. -->
    <path d="M318 219H941V315H318Z" fill="#7DA48B"/>
    <path d="M318 530H491C653 530 720 477 941 477V525C720 525 653 578 491 578H318Z" fill="#7DA48B"/>
    <path d="M318 374H472C646 374 727 315 941 315V369C727 369 646 428 472 428H318Z" fill="#C17A52"/>
    <path d="M318 428H472C646 428 727 459 941 459V477C727 477 646 446 472 446H318Z" fill="#C17A52"/>
    <path d="M365 428H472C646 428 727 459 929 459" fill="none" stroke="#FFF7F0" stroke-width="3"/>

    <g>
      <rect x="64" y="206" width="267" height="123" rx="20" fill="#E8F0E7" stroke="#607F6D" stroke-width="3"/>
      <text x="85" y="249" font-size="32" font-weight="700" fill="#233C32">Team A direct</text>
      <text x="85" y="303" font-size="49" font-weight="700" letter-spacing="-1" fill="#224F3D">$8K</text>
      <rect x="64" y="350" width="267" height="119" rx="20" fill="#FAD6BF" stroke="#AF6542" stroke-width="3"/>
      <text x="85" y="391" font-size="32" font-weight="700" fill="#713B2D">Shared logging</text>
      <text x="85" y="446" font-size="49" font-weight="700" letter-spacing="-1" fill="#713B2D">$6K</text>
      <rect x="64" y="509" width="267" height="124" rx="20" fill="#E8F0E7" stroke="#607F6D" stroke-width="3"/>
      <text x="85" y="553" font-size="32" font-weight="700" fill="#233C32">Team B direct</text>
      <text x="85" y="607" font-size="49" font-weight="700" letter-spacing="-1" fill="#224F3D">$4K</text>
    </g>

    <g fill="#FAD6BF" stroke="#713B2D" stroke-width="2.5">
      <rect x="509" y="358" width="299" height="49" rx="12"/>
      <rect x="509" y="426" width="299" height="49" rx="12"/>
    </g>
    <g fill="#713B2D" font-size="31" font-weight="700" text-anchor="middle">
      <text x="659" y="392">300 GB to $4.5K</text>
      <text x="659" y="460">100 GB to $1.5K</text>
    </g>

    <rect x="929" y="203" width="287" height="180" rx="23" fill="#224F3D"/>
    <rect x="929" y="439" width="287" height="164" rx="23" fill="#224F3D"/>
    <path d="M929 228v87m0 162v48" fill="none" stroke="#A2C6AC" stroke-width="8"/>
    <path d="M929 315v45m0 101v16" fill="none" stroke="#F6B68D" stroke-width="8"/>

    <g fill="#FFFFFF" font-weight="700">
      <text x="963" y="262" font-size="37">Team A total</text>
      <text x="958" y="339" font-size="70" letter-spacing="-2.8">$12.5K</text>
      <text x="963" y="489" font-size="37">Team B total</text>
      <text x="958" y="565" font-size="70" letter-spacing="-2.8">$5.5K</text>
    </g>
    <path d="M369 623H1217" fill="none" stroke="#D7BFB1" stroke-width="2"/>
    <circle cx="757" cy="664" r="16" fill="#DDE9E0"/>
    <path d="m749 665 6 6 10-12" fill="none" stroke="#224F3D" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1216" y="675" text-anchor="end" font-size="33" font-weight="700" fill="#224F3D">Reconciles to $18K invoice</text>
  </g>
</svg>
</svg>