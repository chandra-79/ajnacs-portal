<svg xmlns="http://www.w3.org/2000/svg" data-article-art="cache-stampede-prevention" role="img" aria-label="A hot-key expiry sends all uncoordinated misses to origin, while single-flight allows one refresh and routes the other readers to waiting or stale data." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A hot-key expiry sends all uncoordinated misses to origin, while single-flight allows one refresh and routes the other readers to waiting or stale data."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#655A91"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F3FA" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#282445" font-size="65" font-weight="700">Keep one refresh at the origin</text><path d="M80 154H1200" fill="none" stroke="#655A91" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="195" width="264" height="412" rx="23" fill="#FFFFFF" stroke="#E6E0F5" stroke-width="2.5"/><rect x="99" y="315" width="226" height="165" rx="17" fill="#E6E0F5" stroke="none" stroke-width="2.5"/><text x="212" y="259" text-anchor="middle" fill="#282445" font-size="28" font-weight="700">Expired hot key</text><g transform="translate(212 399) scale(2.234375)" fill="none" stroke="#282445" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="-12" cy="-8" r="15"/><path d="M0 1l25 25m-11-11 9-9m-4 14 9-9"/><circle cx="-15" cy="-11" r="4"/></g><text x="212" y="526" text-anchor="middle" fill="#282445" font-size="17" font-weight="400">Many requests miss at once</text><rect x="365" y="231" width="264" height="376" rx="23" fill="#FFFFFF" stroke="#E6E0F5" stroke-width="2.5"/><rect x="384" y="351" width="226" height="165" rx="17" fill="#E6E0F5" stroke="none" stroke-width="2.5"/><text x="497" y="295" text-anchor="middle" fill="#282445" font-size="21" font-weight="700">Uncoordinated misses</text><g transform="translate(497 435) scale(2.234375)" fill="none" stroke="#282445" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 31 25h-62Z M0-9v16m0 9v1"/></g><text x="497" y="562" text-anchor="middle" fill="#282445" font-size="19" font-weight="400">Each fetches from origin</text><rect x="650" y="195" width="264" height="412" rx="23" fill="#3A3457" stroke="none" stroke-width="2.5"/><rect x="669" y="315" width="226" height="165" rx="17" fill="#655A91" stroke="none" stroke-width="2.5"/><circle cx="882" cy="226" r="12" fill="#BEEDE0" stroke="none" stroke-width="3.5"/><text x="782" y="259" text-anchor="middle" fill="#FFFFFF" font-size="20" font-weight="700">Single-flight refresh</text><g transform="translate(782 399) scale(2.234375)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-24 27v-48h48v48M-13 27v-35H13v35M-31 27H31M-13-8l13 12L13-8"/></g><text x="782" y="526" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="400">Let one worker refill</text><rect x="935" y="231" width="264" height="376" rx="23" fill="#FFFFFF" stroke="#E6E0F5" stroke-width="2.5"/><rect x="954" y="351" width="226" height="165" rx="17" fill="#E6E0F5" stroke="none" stroke-width="2.5"/><text x="1067" y="295" text-anchor="middle" fill="#282445" font-size="32" font-weight="700">Other readers</text><g transform="translate(1067 435) scale(2.234375)" fill="none" stroke="#282445" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="-12" cy="-13" r="9"/><circle cx="13" cy="-10" r="8"/><path d="M-31 22a19 19 0 0138 0Zm43 0h17a16 16 0 00-19-15"/></g><text x="1067" y="562" text-anchor="middle" fill="#282445" font-size="17" font-weight="400">Wait or receive stale value