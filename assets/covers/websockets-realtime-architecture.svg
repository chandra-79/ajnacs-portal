idth="2.5"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#282445" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cy="-14" r="11"/><path d="M-22 25v-4a22 22 0 0144 0v4Z"/></g><text x="788" y="261.5" text-anchor="start" fill="#282445" font-size="31" font-weight="700">Connected clients</text><text x="788" y="293.5" text-anchor="start" fill="#282445" font-size="24" font-weight="400">Keep sessions on gateways</text><path d="M429 400H527V411H672" fill="none" stroke="#655A91" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="345" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#E6E0F5" stroke-width="2.5"/><g transform="translate(738 410.5) scale(0.8125)" fill="none" stroke="#282445" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-28" y="-26" width="56" height="22" rx="5"/><rect x="-28" y="4" width="56" height="22" rx="5"/><path d="M-18-15h3m7 0h3m-13 30h3m7 0h3m12-30h11m-11 30h11"/></g><text x="788" y="406.5" text-anchor="start" fill="#282445" font-size="31" font-weight="700">Gateway instances</text><text x="788" y="438.5" text-anchor="start" fill="#282445" font-size="24" font-weight="400">Own their connections</text><path d="M429 400H549V556H672" fill="none" stroke="#655A91" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="490" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#E6E0F5" stroke-width="2.5"/><g transform="translate(738 555.5) scale(0.8125)" fill="none" stroke="#282445" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-4-15 5-24a12 12 0 0117 17l-9 9a12 12 0 01-17 0m8 13-9 9a12 12 0 01-17-17l9-9a12 12 0 0117 0M-10 10l20-20"/></g><text x="788" y="551.5" text-anchor="start" fill="#282445" font-size="31" font-weight="700">Reconnect path</text><text x="788" y="583.5" text-anchor="start" fill="#282445" font-size="24" font-weight="400">