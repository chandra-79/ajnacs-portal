<svg xmlns="http://www.w3.org/2000/svg" data-article-art="privacy-engineering-data-minimization" role="img" aria-label="A collection filter removes fields that serve no defined purpose, and retained identifiers have bounded access and tested deletion." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A collection filter removes fields that serve no defined purpose, and retained identifiers have bounded access and tested deletion."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#A0482C"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#FAF5EB" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#362018" font-size="59" font-weight="700">Remove data before you collect it</text><path d="M80 154H1200" fill="none" stroke="#A0482C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M289 351H988" fill="none" stroke="#A0482C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="143" y="275" width="154" height="152" rx="32" fill="#F4D9C6" stroke="none" stroke-width="2.5"/><g transform="translate(220 351) scale(1.515625)" fill="none" stroke="#362018" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="220" y="486" text-anchor="middle" fill="#362018" font-size="31" font-weight="700">Requested fields</text><text x="220" y="533" text-anchor="middle" fill="#362018" font-size="21" font-weight="400">Name the purpose of each</text><rect x="423" y="275" width="154" height="152" rx="32" fill="#DCE8A6" stroke="none" stroke-width="2.5"/><g transform="translate(500 351) scale(1.515625)" fill="none" stroke="#3D4A17" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-24 27v-48h48v48M-13 27v-35H13v35M-31 27H31M-13-8l13 12L13-8"/></g><text x="500" y="486" text-anchor="middle" fill="#362018" font-size="29" font-weight="700">Collection filter</text><text x="500" y="533" text-anchor="middle" fill="#362018" font-size="20" font-weight="400">Drop unneeded identifiers</text><path d="M402 343l15 8-15 8Z" fill="#A0482C"/><rect x="703" y="275" width="154" height="152" rx="32" fill="#F4D9C6" stroke="none" stroke-width="2.5"/><g transform="translate(780 351) scale(1.515625)" fill="none" stroke="#362018" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-20" rx="24" ry="9"/><path d="M-24-20v39c0 12 48 12 48 0v-39m-48 13c0 12 48 12 48 0m-48 13c0 12 48 12 48 0"/></g><text x="780" y="486" text-anchor="middle" fill="#362018" font-size="36" font-weight="700">Retained store</text><text x="780" y="533" text-anchor="middle" fill="#362018" font-size="26" font-weight="400">Use limited access</text><path d="M682 343l15 8-15 8Z" fill="#A0482C"/><rect x="983" y="275" width="154" height="152" rx="32" fill="#F4D9C6" stroke="none" stroke-width="2.5"/><g transform="translate(1060 351) scale(1.515625)" fill="none" stroke="#362018" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M0-16V0l12 8M0-26v3m26 23h-3M0 26v-3m-26-23h3"/></g><text x="1060" y="486" text-anchor="middle" fill="#362018" font-size="26" font-weight="700">Expiration boundary</text><text x="1060" y="533" text-anchor="middle" fill="#362018" font-size="19" font-weight="400">Verify deletion and replay</text><path d="M80 584H1200" fill="none" stroke="#A0482C" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
