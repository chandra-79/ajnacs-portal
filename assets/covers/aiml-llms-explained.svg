<svg xmlns="http://www.w3.org/2000/svg" data-article-art="aiml-llms-explained" role="img" aria-label="Autoregressive generation encodes text as tokens, mixes context through attention, selects a next token, and appends it before repeating." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Autoregressive generation encodes text as tokens, mixes context through attention, selects a next token, and appends it before repeating."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#E9DFF7"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#261944" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="59" font-weight="700">How a model writes the next token</text><path d="M80 154H1200" fill="none" stroke="#E9DFF7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M289 351H988" fill="none" stroke="#E9DFF7" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="143" y="275" width="154" height="152" rx="32" fill="#33255B" stroke="none" stroke-width="2.5"/><g transform="translate(220 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="220" y="486" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="700">Text becomes tokens</text><text x="220" y="533" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="400">Encode subword units</text><rect x="423" y="275" width="154" height="152" rx="32" fill="#33255B" stroke="none" stroke-width="2.5"/><g transform="translate(500 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0 0l-21-19M0 0l22-18M0 0-22 19M0 0l22 18"/><circle r="8"/><circle cx="-22" cy="-20" r="7"/><circle cx="22" cy="-19" r="7"/><circle cx="-22" cy="20" r="7"/><circle cx="22" cy="19" r="7"/></g><text x="500" y="486" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="700">Attention mixes context</text><text x="500" y="533" text-anchor="middle" fill="#FFFFFF" font-size="21" font-weight="400">Weight earlier positions</text><path d="M402 343l15 8-15 8Z" fill="#E9DFF7"/><rect x="703" y="275" width="154" height="152" rx="32" fill="#D6EF89" stroke="none" stroke-width="2.5"/><g transform="translate(780 351) scale(1.515625)" fill="none" stroke="#503F15" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-28-27V26H29M-17 14h8V5h11v-13h10v7h9v-20h7"/></g><text x="780" y="486" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="700">Choose a next token</text><text x="780" y="533" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="400">Decode a distribution</text><path d="M682 343l15 8-15 8Z" fill="#E9DFF7"/><rect x="983" y="275" width="154" height="152" rx="32" fill="#33255B" stroke="none" stroke-width="2.5"/><g transform="translate(1060 351) scale(1.515625)" fill="none" stroke="#FFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-4-15 5-24a12 12 0 0117 17l-9 9a12 12 0 01-17 0m8 13-9 9a12 12 0 01-17-17l9-9a12 12 0 0117 0M-10 10l20-20"/></g><text x="1060" y="486" text-anchor="middle" fill="#FFFFFF" font-size="29" font-weight="700">Append and repeat</text><text x="1060" y="533" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="400">Grow the context</text><path d="M80 584H1200" fill="none" stroke="#E9DFF7" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></g></svg>
