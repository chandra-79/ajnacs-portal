<svg xmlns="http://www.w3.org/2000/svg" data-article-art="shift-left-security-patterns" role="img" aria-label="A software change is checked locally, evaluated at code review against a threat case, and verified at release, with monitoring retained for behavior only visible at runtime." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A software change is checked locally, evaluated at code review against a threat case, and verified at release, with monitoring retained for behavior only visible at runtime."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#826118"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F9F5E8" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#3E300D" font-size="65" font-weight="700">Catch the risky change earlier</text><path d="M80 154H1200" fill="none" stroke="#826118" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M89 500H1191" fill="none" stroke="#826118" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><path d="M206 491v-136h28v136Z" fill="#826118"/><rect x="152" y="291" width="136" height="116" rx="22" fill="#F5E6BB" stroke="none" stroke-width="2.5"/><g transform="translate(220 348) scale(1.125)" fill="none" stroke="#3E300D" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-14-16-30 0l16 16m28-32L30 0 14 16M7-23-7 23"/></g><circle cx="220" cy="500" r="11" fill="#F9F5E8" stroke="#826118" stroke-width="3.5"/><text x="220" y="556" text-anchor="middle" fill="#3E300D" font-size="33" font-weight="700">Local checks</text><text x="220" y="590" text-anchor="middle" fill="#3E300D" font-size="22" font-weight="400">Catch obvious mistakes</text><path d="M486 491v-152h28v152Z" fill="#826118"/><rect x="432" y="275" width="136" height="116" rx="22" fill="#D4ECCB" stroke="none" stroke-width="2.5"/><g transform="translate(500 332) scale(1.125)" fill="none" stroke="#264822" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-29 24-20v17c0 14-10 24-24 33C-14 21-24 11-24-3V-20Z M-10 0l7 7 14-15"/></g><circle cx="500" cy="500" r="11" fill="#D4ECCB" stroke="#826118" stroke-width="3.5"/><text x="500" y="556" text-anchor="middle" fill="#3E300D" font-size="29" font-weight="700">Pull request gate</text><text x="500" y="590" text-anchor="middle" fill="#3E300D" font-size="21" font-weight="400">Replay a concrete threat</text><path d="M766 491v-136h28v136Z" fill="#826118"/><rect x="712" y="291" width="136" height="116" rx="22" fill="#F5E6BB" stroke="none" stroke-width="2.5"/><g transform="translate(780 348) scale(1.125)" fill="none" stroke="#3E300D" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-27" y="-23" width="54" height="46" rx="7"/><path d="M-27-9H27M-12-23v14"/></g><circle cx="780" cy="500" r="11" fill="#F9F5E8" stroke="#826118" stroke-width="3.5"/><text x="780" y="556" text-anchor="middle" fill="#3E300D" font-size="24" font-weight="700">Release verification</text><text x="780" y="590" text-anchor="middle" fill="#3E300D" font-size="21" font-weight="400">Check packaged artifacts</text><path d="M1046 491v-136h28v136Z" fill="#826118"/><rect x="992" y="291" width="136" height="116" rx="22" fill="#F5E6BB" stroke="none" stroke-width="2.5"/><g transform="translate(1060 348) scale(1.125)" fill="none" stroke="#3E300D" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-28-27V26H29M-17 14h8V5h11v-13h10v7h9v-20h7"/></g><circle cx="1060" cy="500" r="11" fill="#F9F5E8" stroke="#826118" stroke-width="3.5"/><text x="1060" y="556" text-anchor="middle" fill="#3E300D" font-size="31" font-weight="700">Runtime evidence</text><text x="1060" y="590" text-anchor="middle" fill="#3E300D" font-size="21" font-weight="400">Watch deployed behavior</text></g></svg>
