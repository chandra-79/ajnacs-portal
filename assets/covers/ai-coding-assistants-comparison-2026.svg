<svg xmlns="http://www.w3.org/2000/svg" data-article-art="ai-coding-assistants-comparison-2026" role="img" aria-label="Two hypothetical tools each get 12 patches accepted. Three and six reviewer hours yield four and two accepted patches per review hour." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" preserveAspectRatio="xMidYMid slice" viewBox="0 0 1280 720" role="img" aria-label="Illustrative AI coding pilot: two tools get 12 patches accepted each. Three versus six review hours yields four versus two accepted patches per review hour.">
  <defs>
    <g id="hour-filled">
      <rect width="58" height="64" rx="9" fill="#A894F7"/>
      <path d="M29 12v17" stroke="#4B367F" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="hour-empty">
      <rect x="1" y="1" width="56" height="62" rx="8" fill="none" stroke="#695588" stroke-width="2" stroke-dasharray="6 5"/>
    </g>
  </defs>

  <rect width="1280" height="720" fill="#211637"/>
  <path d="M72 179H1208" fill="none" stroke="#5D4A7B" stroke-width="2"/>
