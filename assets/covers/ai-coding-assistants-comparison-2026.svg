    <text x="73" y="153" font-size="27" font-weight="700" fill="#BCAAD9">Illustrative AI coding pilot</text>

    <path d="M290 434h39q12 0 12-12v-68q0-12 12-12h20m-32 80v86q0 12 12 12h20" fill="none" stroke="#A894F7" stroke-width="4"/>
    <g fill="#A894F7">
      <circle cx="341" cy="434" r="8"/>
      <circle cx="373" cy="342" r="5"/>
      <circle cx="373" cy="520" r="5"/>
    </g>
    <rect x="72" y="242" width="217" height="366" rx="24" fill="#34234E" stroke="#5C477C" stroke-width="2"/>

    <g stroke="#A894F7" stroke-width="3.5">
      <rect x="120" y="306" width="96" height="65" rx="9" fill="#49346A"/>
      <rect x="129" y="296" width="96" height="65" rx="9" fill="#49346A"/>
      <rect x="138" y="286" width="96" height="65" rx="9" fill="#5C4386"/>
      <path d="M155 312h22m-22 12h16m20-5 8 8 15-18" fill="none" stroke="#D9F88B" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="106" y="478" font-size="88" font-weight="700" letter-spacing="-1.5" fill="#F7F3FF">12</text>
    <text x="111" y="523" font-size="29" font-weight="700" fill="#F7F3FF">patches</text>
    <text x="111" y="556" font-size="23" font-weight="700" fill="#BCAAD9">accepted each</text>

    <text x="481" y="250" font-size="31" font-weight="700" fill="#E8DFFF">Review time</text>
    <text x="1095" y="224" font-size="27" font-weight="700" text-anchor="middle" fill="#E8DFFF">Accepted per</text>
    <text x="1095" y="253" font-size="27" font-weight="700" text-anchor="middle" fill="#E8DFFF">review hour</text>

    <path d="M378 420H1208" fill="none" stroke="#5D4A7B" stroke-width="2"/>
    <g fill="#F7F3FF" font-weight="700" font-size="26">
      <text x="387" y="349">Tool A</text>
      <text x="387" y="527">Tool B</text>
    </g>

    <g transform="translate(481 292)">
