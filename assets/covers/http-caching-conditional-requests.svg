<svg xmlns="http://www.w3.org/2000/svg" data-article-art="http-caching-conditional-requests" role="img" aria-label="A cached ETag is sent with a conditional request, resulting in a bodyless 304 if unchanged or fresh bytes with a new validator." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A cached ETag is sent with a conditional request, resulting in a bodyless 304 if unchanged or fresh bytes with a new validator."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#826118"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F9F5E8" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#3E300D" font-size="61" font-weight="700">Validate before sending the body</text><path d="M80 154H1200" fill="none" stroke="#826118" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="80" y="244" width="349" height="311" rx="31" fill="#D4ECCB" stroke="none" stroke-width="2.5"/><g transform="translate(255 352) scale(2.40625)" fill="none" stroke="#264822" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="-12" cy="-8" r="15"/><path d="M0 1l25 25m-11-11 9-9m-4 14 9-9"/><circle cx="-15" cy="-11" r="4"/></g><text x="255" y="454" text-anchor="middle" fill="#264822" font-size="45" font-weight="700">Cached ETag</text><text x="255" y="501" text-anchor="middle" fill="#264822" font-size="26" font-weight="400">Send If-None-Match</text><path d="M429 400H505V266H672" fill="none" stroke="#826118" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="200" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#F5E6BB" stroke-width="2.5"/><g transform="translate(738 265.5) scale(0.8125)" fill="none" stroke="#3E300D" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M-13 0l9 10 17-19"/></g><text x="788" y="261.5" text-anchor="start" fill="#3E300D" font-size="31" font-weight="700">Unchanged resource</text><text x="788" y="293.5" text-anchor="start" fill="#3E300D" font-size="24" font-weight="400">304 keeps the cached body</text><path d="M429 400H527V411H672" fill="none" stroke="#826118" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="345" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#F5E6BB" stroke-width="2.5"/><g transform="translate(738 410.5) scale(0.8125)" fill="none" stroke="#3E300D" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-28-19H12l16 14V19h-56Z M12-19V-5h16M-16-5H2m-18 10h26"/></g><text x="788" y="406.5" text-anchor="start" fill="#3E300D" font-size="31" font-weight="700">Changed resource</text><text x="788" y="438.5" text-anchor="start" fill="#3E300D" font-size="24" font-weight="400">200 and fresh bytes</text><path d="M429 400H549V556H672" fill="none" stroke="#826118" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><rect x="676" y="490" width="521" height="131" rx="19" fill="#FFFFFF" stroke="#F5E6BB" stroke-width="2.5"/><g transform="translate(738 555.5) scale(0.8125)" fill="none" stroke="#3E300D" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="788" y="551.5" text-anchor="start" fill="#3E300D" font-size="31" font-weight="700">Replacement ETag</text><text x="788" y="583.5" text-anchor="start" fill="#3E300D" font-size="24" font-weight="400">Store with the new copy</text><circle cx="429" cy="400" r="8" fill="#D4ECCB" stroke="#826118" stroke-width="3.5"/></g></svg>
