<svg xmlns="http://www.w3.org/2000/svg" data-article-art="ml-feature-engineering" role="img" aria-label="A point-in-time feature join uses data known at prediction time and excludes later records before checking serving parity." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A point-in-time feature join uses data known at prediction time and excludes later records before checking serving parity."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#F4D9C6"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#362018" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#FFFFFF" font-size="59" font-weight="700">Stop future data leaking backward</text><path d="M80 154H1200" fill="none" stroke="#F4D9C6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M89 500H1191" fill="none" stroke="#F4D9C6" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><path d="M206 491v-136h28v136Z" fill="#F4D9C6"/><rect x="152" y="291" width="136" height="116" rx="22" fill="#703420" stroke="none" stroke-width="2.5"/><g transform="translate(220 348) scale(1.125)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M0-16V0l12 8M0-26v3m26 23h-3M0 26v-3m-26-23h3"/></g><circle cx="220" cy="500" r="11" fill="#362018" stroke="#F4D9C6" stroke-width="3.5"/><text x="220" y="556" text-anchor="middle" fill="#FFFFFF" font-size="24" font-weight="700">Prediction timestamp</text><text x="220" y="590" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="400">Name when inputs were known</text><path d="M486 491v-136h28v136Z" f