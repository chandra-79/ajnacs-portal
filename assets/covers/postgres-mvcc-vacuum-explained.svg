<svg xmlns="http://www.w3.org/2000/svg" data-article-art="postgres-mvcc-vacuum-explained" role="img" aria-label="PostgreSQL retains a tuple visible to an old snapshot until the snapshot closes, when vacuum can reclaim the version." width="1280" height="720" viewBox="0 0 1280 720"><svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="PostgreSQL retains a tuple visible to an old snapshot until the snapshot closes, when vacuum can reclaim the version."><defs><marker id="head" markerWidth="13" markerHeight="13" refX="11" refY="6.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 6.5 0 13Z" fill="#655A91"/></marker></defs><rect x="0" y="0" width="1280" height="720" rx="0" fill="#F4F3FA" stroke="none" stroke-width="2.5"/><g font-family="Arial, Helvetica, sans-serif"><text x="77" y="119" text-anchor="start" fill="#282445" font-size="63" font-weight="700">Old snapshots keep tuples alive</text><path d="M80 154H1200" fill="none" stroke="#655A91" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M89 500H1191" fill="none" stroke="#655A91" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#head)"/><path d="M206 491v-136h28v136Z" fill="#655A91"/><rect x="152" y="291" width="136" height="116" rx="22" fill="#E6E0F5" stroke="none" stroke-width="2.5"/><g transform="translate(220 348) scale(1.125)" fill="none" stroke="#282445" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><ellipse cy="-20" rx="24" ry="9"/><path d="M-24-20v39c0 12 48 12 48 0v-39m-48 13c0 12 48 12 48 0m-48 13c0 12 48 12 48 0"/></g><circle cx="220" cy="500" r="11" fill="#F4F3FA" stroke="#655A91" stroke-width="3.5"/><text x="220" y="556" text-anchor="middle" fill="#282445" font-size="33" font-weight="700">Old tuple</text><text x="220" y="590" text-anchor="middle" fill="#282445" font-size="20" font-weight="400">Visible to older snapshot</text><path d="M486 491v-136h28v136Z" fill="#655A91"/><rect x="432" y="291" width="136" height="116" rx="22" fill="#E6E0F5" stroke="none" stroke-width="2.5"/><g transform="translate(500 348) scale(1.125)" fill="none" stroke="#282445" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M0-28l30 15L0 2l-30-15Z M-30 0 0 15 30 0 M-30 13 0 28 30 13"/></g><circle cx="500" cy="500" r="11" fill="#F4F3FA" stroke="#655A91" stroke-width="3.5"/><text x="500" y="556" text-anchor="middle" fill="#282445" font-size="33" font-weight="700">New tuple</text><text x="500" y="590" text-anchor="middle" fill="#282445" font-size="20" font-weight="400">Visible to newer snapshot</text><path d="M766 491v-152h28v152Z" fill="#655A91"/><rect x="712" y="275" width="136" height="116" rx="22" fill="#BEEDE0" stroke="none" stroke-width="2.5"/><g transform="translate(780 332) scale(1.125)" fill="none" stroke="#204D42" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="26"/><path d="M0-16V0l12 8M0-26v3m26 23h-3M0 26v-3m-26-23h3"/></g><circle cx="780" cy="500" r="11" fill="#BEEDE0" stroke="#655A91" stroke-width="3.5"/><text x="780" y="556" text-anchor="middle" fill="#282445" font-size="33" font-weight="700">Snapshot closes</text><text x="780" y="590" text-anchor="middle" fill="#282445" font-size="19" font-weight="400">No active reader needs old</text><path d="M1046 491v-136h28v136Z" fill="#655A91"/><rect x="992" y="291" width="136" height="116" rx="22" fill="#E6E0F5" stroke="none" stroke-width="2.5"/><g transform="translate(1060 348) scale(1.125)" fill="none" stroke="#282445" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="12"/><path d="M-6-28h12l3 7 7 4 8-1 6 10-5 6v8l5 6-6 10-8-1-7 4-3 7H-6l-3-7-7-4-8 1-6-10 5-6v-8l-5-6 6-10 8 1 7-4Z"/></g><circle cx="1060" cy="500" r="11" fill="#F4F3FA" stroke="#655A91" stroke-width="3.5"/><text x="1060" y="556" text-anchor="middle" fill="#282445" font-size="33" font-weight="700">Vacuum</text><text x="1060" y="590" text-anchor="middle" fill="#282445" font-size="21" font-weight="400">Reclaim the dead version</text></g></svg>
