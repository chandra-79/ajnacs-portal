weight="700">Forward pass</text><text x="220" y="304" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="400">Compute a prediction</text><circle cx="500" cy="386" r="66" fill="#584314" stroke="#F5E6BB" stroke-width="3.5"/><g transform="translate(500 386) scale(1.359375)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="27"/><circle r="17"/><circle r="7"/></g><text x="500" y="267" text-anchor="middle" fill="#FFFFFF" font-size="37" font-weight="700">Loss</text><text x="500" y="304" text-anchor="middle" fill="#FFFFFF" font-size="22" font-weight="400">Compare with the target</text><circle cx="780" cy="386" r="66" fill="#D4ECCB" stroke="#F5E6BB" stroke-width="3.5"/><g transform="translate(780 386) scale(1.359375)" fill="none" stroke="#264822" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-19 0H0m0 0v-20h19M0 0v20h19"/><circle cx="-24" r="6"/><circle cx="24" cy="-20" r="6"/><circle cx="24" cy="20" r="6"/></g><text x="780" y="267" text-anchor="middle" fill="#FFFFFF" font-size="34" font-weight="700">Backpropagation</text><text x="780" y="304" text-anchor="middle" fill="#FFFFFF" font-size="19" font-weight="400">Compute parameter gradients</text><circle cx="1060" cy="386" r="66" fill="#584314" stroke="#F5E6BB" stroke-width="3.5"/><g transform="translate(1060 386) scale(1.359375)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle r="12"/><path d="M-6-28h12l3 7 7 4 8-1 6 10-5 6v8l5 6-6 10-8-1-7 4-3 7H-6l-3-7-7-4-8 1-6-10 5-6v-8l-5-6 6-10 8 1 7-4Z"/></g><text x="1060" y="267" text-anchor="middle" fill="#FFFFFF" font-size="37" font-weight="700">Optimizer step</text><text x="1060" y="304" text-anchor="middle" fill="#FFFFFF" font-size="26" font-weight="400">Update weights</text></g></svg>
