ke="none" stroke-width="2.5"/><text x="497" y="295" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">Closed workload</text><g transform="translate(497 435) scale(2.234375)" fill="none" stroke="#E9DFF7" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><circle cy="-14" r="11"/><path d="M-22 25v-4a22 22 0 0144 0v4Z"/></g><text x="497" y="562" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="400">User waits for a response</text><rect x="650" y="195" width="264" height="412" rx="23" fill="#33255B" stroke="none" stroke-width="2.5"/><rect x="669" y="315" width="226" height="165" rx="17" fill="#6746A5" stroke="none" stroke-width="2.5"/><circle cx="882" cy="226" r="12" fill="#D6EF89" stroke="none" stroke-width="3.5"/><text x="782" y="259" text-anchor="middle" fill="#FFFFFF" font-size="35" font-weight="700">Queue growth</text><g transform="translate(782 399) scale(2.234375)" fill="none" stroke="#FFFFFF" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><rect x="-30" y="-15" width="60" height="30" rx="5"/><path d="M-10-15v30m20-30v30M-33 24h66"/></g><text x="782" y="526" text-anchor="middle" fill="#FFFFFF" font-size="18" font-weight="400">Compare delay and backlog</text><rect x="935" y="231" width="264" height="376" rx="23" fill="#33255B" stroke="#E9DFF7" stroke-width="2.5"/><rect x="954" y="351" width="226" height="165" rx="17" fill="#261944" stroke="none" stroke-width="2.5"/><text x="1067" y="295" text-anchor="middle" fill="#FFFFFF" font-size="28" font-weight="700">Replayable test</text><g transform="translate(1067 435) scale(2.234375)" fill="none" stroke="#E9DFF7" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"><path d="M-20-29H9l11 11v47h-40Z M9-29v11h11M-10-6h21m-21 11h21m-21 11h15"/></g><text x="1067" y="562" text-anchor="middle" fill="#FFFFFF" font-size="17" font-weight="400">Record arrival assumptions</text></g></svg>
