<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" data-article-art="giving-credit-precisely" role="img" aria-label="Concept diagram: Notice the work — Identify a specific contribution beyond the visible milestone.; Name its effect — Explain what the contribution changed or made possible.; Choose the setting — Match acknowledgment to context and personal preference.; Preserve the record — Keep attribution attached to the explanation or artifact.."><rect x="-1280" y="-720" width="3840" height="2160" fill="#f3f6fa"/><g font-family="Inter, sans-serif"><text x="62" y="76" font-size="34" font-weight="700" fill="#243651" text-anchor="start"><tspan x="62" dy="0">Give credit while the details are still visible</tspan></text><text x="62" y="159" font-size="23" font-weight="400" fill="#64748b" text-anchor="start"><tspan x="62" dy="0">Conceptual model · Follow the reasoning</tspan></text><rect x="62" y="233" width="265.75" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="62" y="233" width="265.75" height="8" rx="4" fill="#206c68"/><circle cx="95" cy="275" r="17" fill="#206c68"/><text x="95" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="95" dy="0">1</tspan></text><text x="82" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="82" dy="0">Notice the work</tspan></text><text x="82" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="82" dy="0">Identify a specific</tspan><tspan x="82" dy="27.3">contribution beyond</tspan><tspan x="82" dy="27.3">the visible</tspan><tspan x="82" dy="27.3">milestone.</tspan></text><path d="M331.75 367H351.75m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="358.75" y="233" width="265.75" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="358.75" y="233" width="265.75" height="8" rx="4" fill="#306cb3"/><circle cx="391.75" cy="275" r="17" fill="#306cb3"/><text x="391.75" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="391.75" dy="0">2</tspan></text><text x="378.75" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="378.75" dy="0">Name its effect</tspan></text><text x="378.75" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="378.75" dy="0">Explain what the</tspan><tspan x="378.75" dy="27.3">contribution changed</tspan><tspan x="378.75" dy="27.3">or made possible.</tspan></text><path d="M628.5 367H648.5m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="655.5" y="233" width="265.75" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="655.5" y="233" width="265.75" height="8" rx="4" fill="#986527"/><circle cx="688.5" cy="275" r="17" fill="#986527"/><text x="688.5" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="688.5" dy="0">3</tspan></text><text x="675.5" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="675.5" dy="0">Choose the</tspan><tspan x="675.5" dy="31.200000000000003">setting</tspan></text><text x="675.5" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="675.5" dy="0">Match credit to</tspan><tspan x="675.5" dy="27.3">context and personal</tspan><tspan x="675.5" dy="27.3">preference.</tspan></text><path d="M925.25 367H945.25m-8 -7 8 7-8 7" fill="none" stroke="#7b899e" stroke-width="3"/><rect x="952.25" y="233" width="265.75" height="340" rx="18" fill="#fff" stroke="#dce4ed" stroke-width="2"/><rect x="952.25" y="233" width="265.75" height="8" rx="4" fill="#67529b"/><circle cx="985.25" cy="275" r="17" fill="#67529b"/><text x="985.25" y="282" font-size="19" font-weight="700" fill="#fff" text-anchor="middle"><tspan x="985.25" dy="0">4</tspan></text><text x="972.25" y="330" font-size="24" font-weight="700" fill="#243651" text-anchor="start"><tspan x="972.25" dy="0">Preserve the</tspan><tspan x="972.25" dy="31.200000000000003">record</tspan></text><text x="972.25" y="415" font-size="21" font-weight="400" fill="#243651" text-anchor="start"><tspan x="972.25" dy="0">Keep attribution</tspan><tspan x="972.25" dy="27.3">attached to the</tspan><tspan x="972.25" dy="27.3">explanation or</tspan><tspan x="972.25" dy="27.3">artifact.</tspan></text><text x="62" y="682" font-size="19" font-weight="400" fill="#64748b" text-anchor="start"><tspan x="62" dy="0">AJNA / Method, assumptions and values accompany the article.</tspan></text></g></svg>