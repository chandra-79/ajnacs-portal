# ajnacs.com is published by GitHub Pages directly from the main branch, so a
# commit is a deploy. This workflow therefore does two things:
#
#  1. On push — rebuild and verify, and fail loudly if the committed output does
#     not match what the generator produces from content/.
#  2. On a schedule — rebuild so that queued articles whose date has arrived are
#     generated, then commit them. That commit is what publishes them.
#
# The queue lives in content/manifest.json. The generator only emits items whose
# date has passed, so nothing is visible before its time.
name: Build and verify

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1,3,5"   # Mon/Wed/Fri 06:17 UTC — matches the queue cadence
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install generator dependencies
        run: npm install --no-audit --no-fund

      - name: Generate site
        run: npm run build

      - name: Verify
        run: npm test

      - name: Publish anything now due
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            COUNT=$(git status --porcelain | grep -c '^?? insights/' || true)
            git add -A
            git commit -m "Publish scheduled articles due $(date -u +%Y-%m-%d)

          Generated by the scheduled build. ${COUNT} new article page(s)."
            git push
          else
            echo "Nothing was due today."
          fi

      - name: Fail if committed output is stale
        if: github.event_name == 'push'
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::The committed site does not match the generator output."
            echo "Run 'npm run build' and commit the result."
            git status --porcelain | head -20
            exit 1
          fi
          echo "Committed output matches the generator."
