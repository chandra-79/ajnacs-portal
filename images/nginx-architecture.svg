  <text x="412" y="240" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#5f6b86">rate limiting</text>
  
  <path d="M 518 168 L 640 122" stroke="#c9d2e4" stroke-width="2" marker-end="url(#a)"/>
  
  
