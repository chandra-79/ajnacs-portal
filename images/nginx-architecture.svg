    <path d="M 0 0 L 10 5 L 0 10 z" fill="#c9d2e4"/></marker></defs>
  <rect width="860" height="360" rx="12" fill="#ffffff"/>
  <text x="26" y="34" font-family="Montserrat,system-ui,sans-serif" font-size="13" font-weight="800"
        letter-spacing="1.6" fill="#5f6b86">BOTH ROLES IN ONE SERVER BLOCK</text>
  
  
  <rect x="40" y="152" width="150" height="72" rx="9" fill="#2f6fed18" stroke="#2f6fed" stroke-width="1.5"/>
  <text x="115" y="193" text-anchor="middle"
