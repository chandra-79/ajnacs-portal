<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img" aria-label="NGINX as a reverse proxy">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#526f87"/></marker></defs>
  <rect width="860" height="260" rx="12" fill="#eaf0ef"/>
  <path d="M0 63h860M18 232h824" stroke="#a2b3be" opacity=".55"/>
  <text x="26" y="34" font-family="Montserrat,system-ui,sans-serif" font-size="13" font-weight="800"
        letter-spacing=".4" fill="#1b354c">NGINX as a reverse proxy</text>
  
  
  <rect x="40" y="92" width="170" height="76" rx="12" fill="#365e8815" stroke="#365e88" stroke-width="2"/>
  <text x="125" y="127" text-anchor="middle"
        font-family="Montserrat,system-ui,sans-serif" font-size="14" font-weight="700" fill="#1b354c">Client</text>
  <text x="125" y="146" text-anchor="middle"
        font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#445970">browser, API caller</text>
  
  <path d="M 216 130 L 336 130" stroke="#526f87" stroke-width="2" marker-end="url(#a)"/>
  <text x="276" y="122" text-anchor="middle"
        font-family="JetBrains Mono,monospace" font-size="10.5" fill="#445970">request</text>
  
  <rect x="342" y="92" width="176" height="76" rx="12" fill="#346f6815" stroke="#346f68" stroke-width="2"/>
  <text x="430" y="127" text-anchor="middle"
        font-family="Montserrat,system-ui,sans-serif" font-size="14" font-weight="700" fill="#1b354c">NGINX</text>
  <text x="430" y="146" text-anchor="middle"
        font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#445970">listens on :443</text>
  
  <path d="M 524 130 L 644 130" stroke="#526f87" stroke-width="2" marker-end="url(#a)"/>
  <text x="584" y="122" text-anchor="middle"
        font-family="JetBrains Mono,monospace" font-size="10.5" fill="#445970">proxy_pass</text>
  
  <rect x="650" y="92" width="176" height="76" rx="12" fill="#97634215" stroke="#976342" stroke-width="2"/>
  <text x="738" y="127" text-anchor="middle"
        font-family="Montserrat,system-ui,sans-serif" font-size="14" font-weight="700" fill="#1b354c">Application</text>
  <text x="738" y="146" text-anchor="middle"
        font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#445970">127.0.0.1:8080</text>
  <text x="430" y="212" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#445970">
    The application is never addressable from outside. TLS, timeouts and headers terminate at NGINX.</text>
</svg>